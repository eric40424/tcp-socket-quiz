<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCP Socket 上機考</title>
<style>
@font-face {
  font-family: "CJK Mono 2x";
  src: local("MingLiU"), local("細明體"), local("PMingLiU");
  size-adjust: 109.96%;
  unicode-range: U+2E80-2FFF, U+3000-303F, U+3040-30FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
}
:root {
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --bg-code: #f3f4f6;
  --fg: #1f2328;
  --fg-soft: #59636e;
  --border: #d8dee4;
  --accent: #0b6bcb;
  --accent-soft: #e6f0fb;
  --warn-bg: #fff8e6;
  --warn-border: #e8b931;
  --tok-keyword: #cf222e;
  --tok-string: #0a3069;
  --tok-number: #0550ae;
  --tok-comment: #6e7781;
  --tok-title: #8250df;
  --tok-meta: #953800;
}
[data-theme="dark"] {
  --bg: #16181d;
  --bg-soft: #1d2026;
  --bg-code: #23262e;
  --fg: #e3e6ea;
  --fg-soft: #9aa3ad;
  --border: #33373f;
  --accent: #5aa9f5;
  --accent-soft: #1d2b3c;
  --warn-bg: #2e2715;
  --warn-border: #a5832a;
  --tok-keyword: #ff7b72;
  --tok-string: #a5d6ff;
  --tok-number: #79c0ff;
  --tok-comment: #8b949e;
  --tok-title: #d2a8ff;
  --tok-meta: #ffa657;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.75 -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr) 240px;
}

/* ---------- 左側導覽 ---------- */
#sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--bg-soft);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
}
#sidebar .brand { font-weight: 700; font-size: 17px; margin: 0 6px 4px; }
#sidebar .build { color: var(--fg-soft); font-size: 12px; margin: 0 6px 14px; }
#search {
  width: 100%; padding: 7px 10px; margin-bottom: 12px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--fg); font: inherit; font-size: 14px;
}
.group { margin: 14px 6px 4px; font-size: 12px; font-weight: 700; color: var(--fg-soft); letter-spacing: .05em; }
#nav a {
  display: block; padding: 5px 10px; border-radius: 6px;
  color: var(--fg); text-decoration: none; font-size: 14.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#nav a:hover { background: var(--accent-soft); }
#nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#nav .hits { color: var(--fg-soft); font-size: 12px; margin-left: 4px; }
#theme {
  margin: 20px 6px 0; padding: 5px 10px; font: inherit; font-size: 13px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--fg); cursor: pointer;
}

/* ---------- 內文 ---------- */
main { padding: 36px 48px 80px; min-width: 0; }
#content { max-width: 880px; margin: 0 auto; }
#content h1 { font-size: 30px; line-height: 1.3; margin: 0 0 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
#content h2 { font-size: 23px; margin: 40px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
#content h3 { font-size: 19px; margin: 30px 0 10px; }
#content h4 { font-size: 16.5px; margin: 24px 0 8px; }
#content h2, #content h3 { scroll-margin-top: 16px; }
#content a { color: var(--accent); text-decoration: none; }
#content a:hover { text-decoration: underline; }
#content hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
#content blockquote {
  margin: 16px 0; padding: 8px 16px;
  border-left: 4px solid var(--accent); background: var(--accent-soft);
  border-radius: 0 6px 6px 0; color: var(--fg);
}
#content blockquote p { margin: 6px 0; }
#content table { border-collapse: collapse; margin: 16px 0; display: block; overflow-x: auto; font-size: 15px; }
#content th, #content td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; vertical-align: top; }
#content th { background: var(--bg-soft); }
#content tr:nth-child(even) td { background: color-mix(in srgb, var(--bg-soft) 50%, transparent); }
#content code {
  font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
  font-size: .88em; background: var(--bg-code); padding: .15em .4em; border-radius: 4px;
}
#content pre {
  position: relative; background: var(--bg-code); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px 16px; overflow-x: auto; line-height: 1.55;
}
#content pre code { background: none; padding: 0; font-size: 14px; }
/* 沒標語言的區塊多半是 ASCII 圖：英文與框線用 Consolas，中文用縮放過的細明體，
   讓一個中文字剛好等於兩個英文字寬 (Consolas 字寬 0.5498em × 2 = 1.0996em)；行距縮小讓框線連起來 */
#content pre.diagram { line-height: 1.25; }
#content pre.diagram code {
  font-family: Consolas, "CJK Mono 2x", "Sarasa Mono TC", "Noto Sans Mono CJK TC", monospace;
  font-size: 14.5px;
}
#content pre .copy {
  position: absolute; top: 6px; right: 6px; padding: 2px 8px; font-size: 12px;
  border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--fg-soft);
  cursor: pointer; opacity: 0; transition: opacity .15s;
}
#content pre:hover .copy { opacity: 1; }
#content details {
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; margin: 10px 0;
  background: var(--bg-soft);
}
#content details[open] { background: var(--bg); }
#content summary { cursor: pointer; }
#content details[open] summary { margin-bottom: 8px; }
#content img { max-width: 100%; }
mark { background: #ffe58a; color: inherit; border-radius: 2px; }
[data-theme="dark"] mark { background: #6b5a12; }

.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border); }
.pager a {
  flex: 1; display: block; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
  color: var(--fg); text-decoration: none;
}
.pager a:hover { border-color: var(--accent); }
.pager .label { display: block; font-size: 12px; color: var(--fg-soft); }
.pager .next { text-align: right; }

.spoiler {
  margin: 40px auto; max-width: 560px; padding: 28px; text-align: center;
  background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 10px;
}
.spoiler h2 { margin-top: 0; border: 0 !important; }
.spoiler button {
  margin-top: 8px; padding: 8px 18px; font: inherit; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--warn-border); background: var(--bg); color: var(--fg);
}

/* ---------- 右側目錄 ---------- */
#toc {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 36px 16px 20px 8px; font-size: 13.5px;
}
#toc .title { font-weight: 700; color: var(--fg-soft); font-size: 12px; margin-bottom: 8px; }
#toc a { display: block; padding: 3px 0 3px 10px; color: var(--fg-soft); text-decoration: none; border-left: 2px solid var(--border); }
#toc a.h3 { padding-left: 22px; font-size: 13px; }
#toc a:hover { color: var(--accent); }
#toc a.active { color: var(--accent); border-left-color: var(--accent); }

/* ---------- 程式碼上色 (highlight.js token) ---------- */
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-literal, .hljs-type { color: var(--tok-keyword); }
.hljs-string, .hljs-regexp, .hljs-char.escape_ { color: var(--tok-string); }
.hljs-number, .hljs-symbol, .hljs-variable, .hljs-attr, .hljs-attribute { color: var(--tok-number); }
.hljs-comment, .hljs-quote { color: var(--tok-comment); font-style: italic; }
.hljs-title, .hljs-section, .hljs-title.function_ { color: var(--tok-title); }
.hljs-meta, .hljs-params, .hljs-subst { color: var(--tok-meta); }

/* ---------- RWD ---------- */
@media (max-width: 1200px) {
  body { grid-template-columns: 260px minmax(0, 1fr); }
  #toc { display: none; }
}
@media (max-width: 760px) {
  body { display: block; }
  #sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 24px 18px 60px; }
}
@media print {
  body { display: block; }
  #sidebar, #toc, .pager, .copy { display: none !important; }
}
</style>
</head>
<body>
<nav id="sidebar">
  <div class="brand">TCP Socket 上機考</div>
  <div class="build">產生時間 2026-10-30 13:36</div>
  <input id="search" type="search" placeholder="搜尋全部文件…  ( / )">
  <div id="nav"></div>
  <button id="theme" type="button">切換深色 / 淺色</button>
</nav>
<main><article id="content"></article></main>
<aside id="toc"></aside>

<script>
const DOCS = [{"path": "README.md", "title": "TCP Socket 上機考 (仿成大資工特選乙組形式)", "group": "總覽", "spoiler": false, "md": "# TCP Socket 上機考 (仿成大資工特選乙組形式)\n\n參考 [2024 成大資工特選乙組上機考心得](https://emtech.cc/p/srecruit-ncku-quiz/) 的形式設計：\n考生拿到一個**寫到一半、藏有 bug 的專案**，要補完 TODO、修好 bug，並用自動評分程式驗證。\n原考題的主題是 ROS2，這份改成 **TCP Socket 程式設計**。\n\n## 目錄結構\n\n```\ntcp-socket-quiz/\n├── docs.html            ← 所有文件的網頁版 (雙擊用瀏覽器開啟)\n├── EXAM.md              ← 試題本 (從這裡開始讀)\n├── Dockerfile           ← Ubuntu 22.04 考試環境\n├── scripts/\n│   ├── setup-wsl-docker.sh  ← 在 WSL 裡安裝 Docker Engine 並 build image\n│   └── build_docs.py        ← 把所有 .md 打包成 docs.html\n├── docs/                ← docs.html 的範本與內嵌的 JS 函式庫 (marked、highlight.js)\n├── problems/            ← 作答區 (只改這裡)\n│   ├── p1_echo/         C:      echo server / client\n│   ├── p2_framing/      Python: length-prefixed 訊息邊界\n│   ├── p3_chat/         Python: selectors 非阻塞聊天室\n│   └── p4_kvstore/      Python: 多執行緒 key-value server\n├── judge/\n│   └── judge.py         ← 自動評分程式\n├── materials/           ← 教材 (考前讀)\n└── solutions/           ← 參考解答與解析 (考完再看！)\n```\n\n## 瀏覽文件\n\n直接用瀏覽器開啟 **`docs.html`**（不需要網路、不需要架 server）。\n裡面整合了試題本、7 章教材與解答，有左側導覽、本頁目錄、全文搜尋（按 `/`）、程式碼上色與深色模式。\n解答頁預設會鎖住，按下「我考完了」才會顯示。\n\n修改任何 `.md` 之後，重新產生網頁：\n\n```powershell\nwsl -d Ubuntu-22.04 -- python3 /mnt/c/Users/feng_hsiang/tcp-socket-quiz/scripts/build_docs.py\n```\n\n## 快速開始\n\n### 方法一：WSL2 + Docker (推薦，和考試環境一致，P1 需要)\n\n本機已安裝好：WSL2 的 `Ubuntu-22.04`、Docker Engine、考試環境 image `tcp-quiz`。\n\n**開始作答**\n\n```powershell\n# 1. PowerShell：進入 Ubuntu\nwsl -d Ubuntu-22.04\n```\n\n```bash\n# 2. Ubuntu：進入考試環境的 container (專案資料夾會掛載到 /exam)\ncd /mnt/c/Users/feng_hsiang/tcp-socket-quiz\ndocker run --rm -it -v \"$PWD:/exam\" tcp-quiz\n\n# 3. container 裡：評分\npython3 judge/judge.py\n```\n\n- 程式碼可以直接在 Windows 上編輯 `problems\\`（例如用 VS Code），存檔後 container 裡立刻看得到\n- 不想進 container，也可以在 PowerShell 一行跑完評分：\n  ```powershell\n  wsl -d Ubuntu-22.04 -- docker run --rm -v /mnt/c/Users/feng_hsiang/tcp-socket-quiz:/exam tcp-quiz python3 judge/judge.py\n  ```\n- 修改了 `Dockerfile` 之後要重新 build：`docker build -t tcp-quiz .`\n- WSL 的資源上限設定在 `C:\\Users\\feng_hsiang\\.wslconfig`（目前 3GB RAM / 2 CPU）\n\n**在新電腦上從頭安裝**\n\n1. 用系統管理員身分開 PowerShell：`wsl --install -d Ubuntu-22.04`，然後重新開機\n   （如果內建的 `wsl.exe` 不接受 `--install`，改用 `winget install Microsoft.WSL`）\n2. 執行 `wsl -d Ubuntu-22.04 -- bash /mnt/c/Users/<你>/tcp-socket-quiz/scripts/setup-wsl-docker.sh`，\n   它會安裝 Docker Engine、build image，並用參考解答驗證 judge（應為 100/100）\n3. 執行 `wsl --shutdown` 讓設定生效\n\n> 目前 Ubuntu 預設以 root 登入。要建立自己的帳號：\n> `adduser <名字> && usermod -aG sudo,docker <名字> && printf '[user]\\ndefault=<名字>\\n' >> /etc/wsl.conf`，\n> 再執行 `wsl --shutdown`。\n\n### 方法二：Linux / macOS / WSL\n\n```bash\npython3 judge/judge.py           # 評全部\npython3 judge/judge.py p2        # 只評 P2\npython3 judge/judge.py -v p3     # 失敗時顯示 server 輸出\n```\n\n### 方法三：Windows 原生 Python\n\nP2 ~ P4 可以直接跑；P1 (C 的 POSIX socket) 會被略過。\n\n```powershell\npython judge\\judge.py p2 p3 p4\n```\n\n## 建議流程\n\n1. 考前：讀 `materials/`，順序是 `01` → `07`\n2. 計時 4 小時，打開 `EXAM.md` 開始作答\n3. 寫一段就跑一次 judge\n4. 考完：對照 `solutions/README.md` 的解析，並試著回答 `materials/07-interview-questions.md` 的口試題\n\n驗證 judge 本身：`python3 judge/judge.py --target solutions` 應該拿到 100 分\n（Windows 原生環境只會有 73 分，因為 P1 與 Linux-only 測試被略過）。\n"}, {"path": "EXAM.md", "title": "TCP Socket 程式設計 上機考 試題本", "group": "總覽", "spoiler": false, "md": "# TCP Socket 程式設計 上機考 試題本\n\n> 模擬成大資工特選上機考形式：拿到一份「寫到一半、還有 bug」的專案，\n> 在時限內補完 TODO、修好 bug，用自動評分程式 (judge) 驗證，judge 給的分數就是你的成績。\n\n---\n\n## 考試規則\n\n| 項目 | 說明 |\n|------|------|\n| 時間 | 4 小時 |\n| 語言 | C (C99)、Python 3.10+ (只能用標準函式庫) |\n| 環境 | Ubuntu 22.04 (可以用專案附的 `Dockerfile`)、gcc、bash |\n| 可查資料 | `man` page、Python 官方文件、搜尋引擎 |\n| 禁止 | 安裝套件、與他人交談、**偷看 `solutions/`** |\n| 評分 | `python3 judge/judge.py`，可以無限次重跑 |\n| 同分時 | 先完成的人排前面 (原考試的計分方式：`分數 = 解題分 + (1 − 完成次序 / 人數)`) |\n\n**作答範圍**：只能修改 `problems/` 底下的檔案。judge 會檢查程式的 **行為**，不會比對寫法，\n所以只要符合規格，怎麼實作都可以。\n\n**注意**：除了標示 `TODO` 的地方，每一題的程式碼裡還**藏有 bug**（數量寫在題目說明裡）。\n只補 TODO 沒有修 bug，是拿不到滿分的。\n\n---\n\n## 配分總覽\n\n| 題號 | 主題 | 語言 | 配分 | 檔案 |\n|------|------|------|------|------|\n| P1 | Echo Server / Client | C | 25 | `problems/p1_echo/server.c`, `client.c` |\n| P2 | 訊息邊界 (Framing) | Python | 20 | `problems/p2_framing/protocol.py` |\n| P3 | 非阻塞多人聊天室 | Python | 30 | `problems/p3_chat/chat_server.py` |\n| P4 | 多執行緒 Key-Value Server | Python | 25 | `problems/p4_kvstore/kv_server.py` |\n| | **合計** | | **100** | |\n\n> P4 會 `import` P2 寫的 `protocol.py`。**P2 沒寫好，P4 也會一起掛掉**，建議照順序寫。\n\n---\n\n## P1：Echo Server / Client (C，25 分)\n\n### 情境\n\n你接手了一個學長寫到一半的 echo server：client 送來什麼，server 就原封不動回傳。\n學長說「在我電腦上可以跑」，但它連編譯後都連不上。\n\n### 規格\n\n**server** — `./server <port>`\n1. 監聽 `0.0.0.0:<port>`，成功 `listen()` 之後印出一行包含 `listening` 的訊息\n2. 一次服務一個 client（iterative server），收到的資料原封不動送回\n3. client 關閉連線後，要能繼續 `accept()` 下一個 client\n4. 能正確回傳大量資料（1 MiB）\n5. server 被關掉後**立刻**重新啟動，必須能 bind 同一個 port\n\n**client** — `./client <ipv4-address> <port>`\n1. 從 stdin 一行一行讀取，送給 server\n2. 把 server 回傳的資料**完整地**印到 stdout（stdout 只能有 server 回傳的資料）\n3. stdin 結束後關閉連線，exit code 為 0\n\n### 要做的事\n\n| 編號 | 檔案 | 內容 |\n|------|------|------|\n| TODO 1-A | server.c | 建立 IPv4 TCP socket |\n| TODO 1-B | server.c | 設定 `SO_REUSEADDR` |\n| TODO 1-C | server.c | `bind()` + `listen()` |\n| TODO 1-D | server.c | `accept()` |\n| TODO 1-E | server.c | 完成 `send_all()` |\n| TODO 1-F | client.c | 建立 socket 並 `connect()` |\n| TODO 1-G | client.c | 改寫錯誤的接收邏輯 |\n| 🐞 × 2 | server.c | 藏有 2 個 bug |\n\n### 評分項目\n\n| 測試 | 分數 |\n|------|------|\n| `gcc -std=c99` 編譯成功 | 3 |\n| 基本 echo | 5 |\n| 1 MiB 大量資料 echo | 5 |\n| 第一個 client 離開後能服務下一個 | 4 |\n| server 重啟後能立刻 bind 同一個 port | 3 |\n| client 能正確處理分段抵達的資料 | 5 |\n\n### 提示\n- `man 2 socket`、`man 2 bind`、`man 7 tcp`、`man 7 socket`\n- 手動測試：`make && ./server 9000`，另開終端機 `nc 127.0.0.1 9000` 或 `./client 127.0.0.1 9000`\n- 「在本機手動測試看起來沒問題」不代表是對的，judge 的測試 server 會**故意把資料切成很小塊、慢慢回傳**\n\n---\n\n## P2：訊息邊界 Length-prefixed Framing (Python，20 分)\n\n### 情境\n\nTCP 是 **byte stream**，沒有「一則訊息」的概念。對方 `send()` 了兩次，你可能一次 `recv()`\n就全部收到（黏包），也可能要 `recv()` 好幾次才收齊一則（半包）。\n我們要在 TCP 上面自己定義訊息邊界。\n\n### 線上格式\n\n```\n+-------------------+---------------------------+\n| length (4 bytes)  | payload (length bytes)    |\n| uint32 big-endian |                           |\n+-------------------+---------------------------+\n```\n\n例：`b\"hello\"` → `b\"\\x00\\x00\\x00\\x05hello\"`；空訊息 `b\"\"` → `b\"\\x00\\x00\\x00\\x00\"`\n\n### 要做的事\n\n| 編號 | 函式 | 規格 |\n|------|------|------|\n| TODO 2-A | `recv_exact(sock, n)` | 剛好讀 n bytes；不可多讀；讀滿前連線關閉 → `ConnectionError` |\n| TODO 2-B | `send_msg(sock, payload)` | 送出 header + payload；超過 `MAX_MSG_SIZE` → `ProtocolError` |\n| TODO 2-C | `recv_msg(sock)` | 收一則訊息；訊息之間正常關閉 → `None`；訊息中途關閉 → `ConnectionError`；長度超過上限 → `ProtocolError` |\n| 🐞 × 1 | | 藏有 1 個 bug |\n\n### 評分項目\n\n| 測試 | 分數 |\n|------|------|\n| `send_msg` 的線上格式 | 3 |\n| `recv_exact` 拼湊分段資料、不多讀 | 3 |\n| `recv_exact` 資料不足時 → `ConnectionError` | 2 |\n| 黏包（一次收到多則訊息，含空訊息） | 3 |\n| 半包（一個 byte 一個 byte 抵達） | 3 |\n| EOF 處理 | 2 |\n| length 過大 → `ProtocolError` | 2 |\n| 5 MiB 訊息與 JSON 往返 | 2 |\n\n---\n\n## P3：非阻塞多人聊天室 (Python，30 分)\n\n### 情境\n\n做一個**單執行緒**的聊天室 server，用 `selectors` 同時處理很多連線。\n不能開 thread，所有 socket 都必須是 non-blocking。\n\n### 協定（純文字、UTF-8、一行以 `\\n` 結尾）\n\n| client 送出 | server 的動作 |\n|-------------|---------------|\n| 連線後的第一行 `<nick>` | 設定暱稱，廣播 `* <nick> joined\\n` 給**其他人** |\n| 一般訊息 `<text>` | 廣播 `[<nick>] <text>\\n` 給**其他人**（不含自己） |\n| `/who` | 只回給自己：`* online: <暱稱依字母排序，以 \", \" 分隔>\\n` |\n| `/quit` | 關閉這條連線，廣播 `* <nick> left\\n`；同一包裡 `/quit` 後面的內容要忽略 |\n| （直接斷線） | 廣播 `* <nick> left\\n` |\n\n- 還沒送出暱稱的連線**不算在線上**，不會收到任何廣播\n- 行尾的 `\\r` 要去掉（相容 `telnet` / Windows）\n\n### 要做的事\n\n| 編號 | 位置 | 內容 |\n|------|------|------|\n| TODO 3-A | `__init__` | 把 listening socket 註冊到 selector |\n| TODO 3-B | `_accept` | accept → non-blocking → 註冊 |\n| TODO 3-C | `_on_readable` | 從 buffer 切出完整的行 |\n| TODO 3-D | `send` | 開始監聽 `EVENT_WRITE` |\n| TODO 3-E | `_on_writable` | 送完後取消 `EVENT_WRITE` |\n| TODO 3-F | `_disconnect` | 清理連線、廣播離開訊息 |\n| 🐞 × 1 | | 藏有 1 個 bug |\n\n### 評分項目\n\n| 測試 | 分數 |\n|------|------|\n| 加入通知（暱稱分段抵達） | 4 |\n| 廣播給其他人、不含自己 | 4 |\n| 一次收到多行與不完整的行 | 4 |\n| `/who` 只回給自己 | 3 |\n| 尚未設定暱稱的連線不會收到廣播 | 3 |\n| `/quit` | 4 |\n| client 直接斷線 | 3 |\n| 30 個 client 同時聊天 | 3 |\n| 閒置時不會空轉（CPU 使用率，僅 Linux） | 2 |\n\n### 提示\n- 手動測試：`python3 chat_server.py 9000`，再開幾個 `python3 chat_client.py 127.0.0.1 9000` 或 `nc 127.0.0.1 9000`\n- 為什麼不能在 `send()` 裡直接 `sock.sendall()`？想想看 non-blocking socket 的 send buffer 滿了會怎樣\n\n---\n\n## P4：多執行緒 Key-Value Server (Python，25 分)\n\n### 情境\n\n做一個迷你版 Redis。每條連線一個 thread，使用 P2 的 length-prefixed JSON 溝通。\n\n### Request / Response\n\n| Request | Response |\n|---------|----------|\n| `{\"op\":\"SET\",\"key\":k,\"value\":v}` | `{\"ok\":true}` |\n| `{\"op\":\"GET\",\"key\":k}` | `{\"ok\":true,\"value\":v}`；不存在 → `{\"ok\":false,\"error\":\"...\"}` |\n| `{\"op\":\"DEL\",\"key\":k}` | `{\"ok\":true,\"deleted\":true/false}` |\n| `{\"op\":\"INCR\",\"key\":k,\"by\":n}` | `{\"ok\":true,\"value\":新值}`；`by` 預設 1；不存在視為 0；原值不是整數 → `ok:false` |\n| 未知 op、不合法的 JSON | `{\"ok\":false,\"error\":\"...\"}`，**連線不可以斷** |\n\n其他需求：\n- 同時服務多個 client\n- client 超過 `--idle-timeout` 秒沒送資料 → server 主動斷線\n- 多個 client 同時 `INCR` 同一個 key，結果必須正確\n\n### 要做的事\n\n| 編號 | 位置 | 內容 |\n|------|------|------|\n| TODO 4-A | `serve` | 每個連線開一條 thread |\n| TODO 4-B | `handle_conn` | request/response 迴圈、逾時、錯誤處理 |\n| TODO 4-C | `handle_request` | 實作 `DEL` |\n| 🐞 × 1 | | 藏有 1 個 bug |\n\n### 評分項目\n\n| 測試 | 分數 |\n|------|------|\n| SET / GET | 4 |\n| GET 不存在的 key 與 DEL | 3 |\n| 錯誤的 request 不中斷連線 | 3 |\n| INCR | 3 |\n| 同時服務多個 client | 4 |\n| 10 個 client 同時 INCR（race condition） | 5 |\n| 閒置逾時 | 3 |\n\n---\n\n## 加分思考題（不計分，口試可能會問）\n\n1. P1 的 server 一次只能服務一個 client，有哪些方法可以改成同時服務多個？各自的優缺點？\n2. P3 如果有一個 client 只連線、從來不 `recv()`，其他人一直講話，server 會發生什麼事？要怎麼防範？\n3. P4 的 thread-per-connection 模型在 10,000 個連線時會遇到什麼問題？\n4. 為什麼 P2 要設 `MAX_MSG_SIZE`？拿掉會有什麼安全問題？\n5. judge 測試「server 重啟」時，TIME_WAIT 是出現在 server 端還是 client 端？為什麼？\n"}, {"path": "materials/README.md", "title": "教材", "group": "教材", "spoiler": false, "md": "# 教材\n\n建議依序閱讀，每章最後都有練習題。標示的題號代表這一章是那一題的必備知識。\n\n| 章節 | 內容 | 對應題目 |\n|------|------|---------|\n| [01. TCP 基礎觀念](01-tcp-fundamentals.md) | 分層、TCP vs UDP、byte stream、三次握手、四次揮手、TIME_WAIT、流量控制、Nagle | 全部 |\n| [02. Berkeley Socket API (C)](02-socket-api-c.md) | socket/bind/listen/accept/connect、byte order、send_all、SIGPIPE、fork | P1 |\n| [03. Python socket](03-python-socket.md) | C ↔ Python 對照、sendall、timeout、例外階層、bytes/str、struct | P2 ~ P4 |\n| [04. 訊息邊界 Framing](04-message-framing.md) | 黏包/半包、分隔符號、長度前綴、串流錯位 | P2、P3、P4 |\n| [05. 併發模型](05-concurrency-models.md) | iterative/fork/thread/event-driven、select/epoll、selectors、race condition、lock、asyncio | P3、P4 |\n| [06. 除錯工具](06-debugging-tools.md) | nc、ss、tcpdump、Wireshark、strace、錯誤訊息速查 | 全部 |\n| [07. 口試題](07-interview-questions.md) | 由淺入深的口試題與參考答案 | 考後 |\n\n## 時間分配建議（準備期 1 週）\n\n| 天 | 內容 |\n|----|------|\n| 1 | 01 + 06，裝好 Docker 環境，用 `nc` 玩一玩 |\n| 2 | 02，自己從零寫一個 C echo server（不看 P1） |\n| 3 | 03 + 04，用 Python 寫 length-prefix 的 client/server |\n| 4 | 05，用 selectors 寫一個 echo server，再用 thread 寫一次 |\n| 5 | 模擬考：計時 4 小時寫 `EXAM.md` |\n| 6 | 對照 `solutions/README.md` 檢討，做每章的練習題 |\n| 7 | 07 口試題，練習用自己的話說出來 |\n"}, {"path": "materials/01-tcp-fundamentals.md", "title": "01. TCP 基礎觀念", "group": "教材", "spoiler": false, "md": "# 01. TCP 基礎觀念\n\n> 寫 socket 程式之前，要先知道 TCP 幫你做了什麼、**沒有**幫你做什麼。\n\n## 1. 網路分層：socket 在哪一層？\n\n```\n 應用層   HTTP, SSH, 你自己定義的協定 (P2 的 length-prefix、P3 的聊天協定)\n ───────────────────────── ← socket API 就是這條線\n 傳輸層   TCP, UDP          (作業系統 kernel 實作)\n 網路層   IP                (負責「送到哪台主機」)\n 鏈結層   Ethernet, Wi-Fi\n```\n\nsocket 是作業系統提供給應用程式的介面。你呼叫 `send()`，資料只是被**複製到 kernel 的 send buffer**；\n真正什麼時候、切成幾個封包送出去，是 kernel 的 TCP 決定的。\n\n一條 TCP 連線由 **四元組** 唯一識別：`(來源 IP, 來源 port, 目的 IP, 目的 port)`。\n所以一個 server 的 port 80 可以同時有很多條連線——它們的 client 端 IP 或 port 不同。\n\n## 2. TCP vs UDP\n\n| | TCP | UDP |\n|---|-----|-----|\n| 連線 | 需要先建立連線 (handshake) | 不需要 |\n| 可靠性 | 保證送達、不重複、**依序** | 可能遺失、重複、亂序 |\n| 資料單位 | **byte stream (沒有訊息邊界)** | datagram (有訊息邊界) |\n| 流量控制 / 壅塞控制 | 有 | 沒有 |\n| 標頭大小 | 20 ~ 60 bytes | 8 bytes |\n| 典型應用 | HTTP/1.1、HTTP/2、SSH、資料庫 | DNS、影音串流、遊戲、QUIC (HTTP/3) |\n\n### 最重要的一點：TCP 是 byte stream\n\n```\nsender:   send(\"hello\")  send(\"world\")\n                   │\n           (TCP 只保證 bytes 依序抵達)\n                   ▼\nreceiver: recv() → \"hel\"\n          recv() → \"loworld\"\n```\n\nTCP **不保留** `send()` 的邊界。一次 `send` 可能要多次 `recv` 才收完（**半包**），\n多次 `send` 也可能一次 `recv` 就全部收到（**黏包**）。\n「黏包」這個詞其實是誤解——TCP 本來就沒有「包」，只有 stream。\n要區分訊息，必須由應用層自己定義邊界 → 見 [04-message-framing.md](04-message-framing.md)。\n\n> P1 的 client、P2 整題、P3 的切行，考的都是這個觀念。\n\n## 3. 三次握手 (3-way handshake)\n\n```\n   Client                               Server\n     │                                    │  (LISTEN)\n     │ ──────── SYN, seq=x ─────────────► │\n(SYN_SENT)                                │\n     │ ◄─── SYN+ACK, seq=y, ack=x+1 ───── │ (SYN_RCVD)\n     │                                    │\n     │ ──────── ACK, ack=y+1 ───────────► │\n(ESTABLISHED)                       (ESTABLISHED)\n```\n\n對應到 socket API：\n- server 呼叫 `listen()` 之後，kernel 就會自動回應握手；完成握手的連線會進入 **accept queue**\n- `accept()` 只是從 accept queue 裡**拿出一條已經建好的連線**\n- client 的 `connect()` 會在握手完成後返回\n- `listen(fd, backlog)` 的 backlog 就是 accept queue 的長度上限\n\n**為什麼是三次，不是兩次？**\n1. 雙方都要確認「對方的初始序號 (ISN)」並且讓對方知道自己收到了——SYN 和 ACK 各需要一次確認，中間兩個可以合併，所以最少三次\n2. 防止**已失效的舊 SYN** 突然抵達時建立錯誤連線：兩次握手的話，server 收到舊 SYN 就會直接建立連線、浪費資源\n\n## 4. 四次揮手 (4-way close)\n\n```\n   Client (主動關閉)                       Server (被動關閉)\n     │ ───────────── FIN ───────────────► │\n(FIN_WAIT_1)                              │ (CLOSE_WAIT)  ← recv() 回傳 0\n     │ ◄──────────── ACK ──────────────── │\n(FIN_WAIT_2)                              │  (server 可能還有資料要送)\n     │ ◄──────────── FIN ──────────────── │ (LAST_ACK)    ← server 呼叫 close()\n(TIME_WAIT)                               │\n     │ ───────────── ACK ───────────────► │ (CLOSED)\n  等待 2MSL\n(CLOSED)\n```\n\n- TCP 是**全雙工**的，兩個方向要各自關閉，所以 FIN/ACK 要兩組\n- 收到 FIN 後，`recv()` 會回傳 **0**——這是「對方不會再送資料了」的唯一訊號\n  （P1 的 bug：沒處理 `recv() == 0`）\n- `shutdown(fd, SHUT_WR)` 可以只關閉「我→對方」的方向（half-close），仍然能繼續收資料\n\n### TIME_WAIT\n\n**主動關閉**的一方會進入 TIME_WAIT，等待 **2 MSL**（Maximum Segment Lifetime，Linux 上固定 60 秒）。\n\n為什麼要等？\n1. 最後一個 ACK 可能遺失，對方會重送 FIN，我們要還在才能再回 ACK\n2. 讓這條連線在網路上殘留的舊封包全部消失，避免被同一個四元組的新連線誤收\n\n**實務影響**：server 主動關閉連線後重啟，`bind()` 同一個 port 會失敗：\n`bind: Address already in use` (`EADDRINUSE`)。\n解法：在 `bind()` 前設定 `SO_REUSEADDR` → 見 [02-socket-api-c.md](02-socket-api-c.md)。\n（P1 的 TODO 1-B，judge 會測）\n\n### CLOSE_WAIT\n\n被動關閉的一方收到 FIN 後進入 CLOSE_WAIT，直到**應用程式自己呼叫 `close()`**。\n如果你在 `ss` 上看到大量 CLOSE_WAIT，幾乎都是**程式忘了 close**（fd leak）。\n\n## 5. TCP 狀態圖 (簡化)\n\n```\n                           ┌──────────┐\n                           │  CLOSED  │\n                           └──────────┘\n             listen() │                     │ connect() / 送 SYN\n                      ▼                     ▼\n                ┌──────────┐          ┌──────────┐\n                │  LISTEN  │          │ SYN_SENT │\n                └──────────┘          └──────────┘\n    收 SYN/送 SYN+ACK │                     │ 收 SYN+ACK/送 ACK\n                      ▼                     │\n                ┌──────────┐                │\n                │ SYN_RCVD │                │\n                └──────────┘                │\n               收 ACK │                     │\n                      ▼                     ▼\n                ┌────────────────────────────────┐\n                │          ESTABLISHED           │\n                └────────────────────────────────┘\n       close()/送 FIN │                     │ 收 FIN/送 ACK\n                      ▼                     ▼\n                ┌──────────┐          ┌──────────┐\n                │FIN_WAIT_1│          │CLOSE_WAIT│\n                └──────────┘          └──────────┘\n               收 ACK │                     │ close()/送 FIN\n                      ▼                     ▼\n                ┌──────────┐          ┌──────────┐\n                │FIN_WAIT_2│          │ LAST_ACK │ ── 收 ACK ──► CLOSED\n                └──────────┘          └──────────┘\n        收 FIN/送 ACK │\n                      ▼\n                ┌──────────┐\n                │TIME_WAIT │ ── 等待 2MSL ──► CLOSED\n                └──────────┘\n```\n\n用 `ss -tan` 可以看到每條連線目前的狀態。\n\n## 6. 可靠傳輸、流量控制與壅塞控制\n\n| 機制 | 解決的問題 | 怎麼做 |\n|------|-----------|--------|\n| 序號 (seq) + 確認 (ack) | 遺失、重複、亂序 | 每個 byte 都有序號；收方回 ack 告訴對方「我收到第 N byte 之前的所有資料了」 |\n| 重傳 (retransmission) | 遺失 | 逾時 (RTO) 或收到 3 個重複 ack (fast retransmit) 就重送 |\n| 滑動視窗 / 流量控制 | **收方**處理不來 | 收方在 ack 中告知 receive window (剩多少 buffer)，送方不能超過 |\n| 壅塞控制 | **網路**塞車 | slow start、congestion avoidance (AIMD)、CUBIC、BBR |\n\n### 和 socket 程式的關係：buffer 會滿\n\n```\n[你的程式] send() → [send buffer] ──網路──► [receive buffer] → recv() [對方的程式]\n```\n\n- 對方不 `recv()` → 對方的 receive buffer 滿 → window = 0 → 你的 send buffer 也滿 →\n  你的 **blocking `send()` 會卡住**，non-blocking `send()` 會回傳 `EAGAIN` / `BlockingIOError`\n- 這就是為什麼 `send()` 可能只送出一部分（partial send），也是 P3 需要 outbuf 的原因\n- 兩邊同時大量 send、都不 recv → **互相卡死 (deadlock)**。judge 測 1 MiB echo 時，\n  就是用另一條 thread 送、主 thread 收來避免這個問題\n\n## 7. Nagle 演算法與 Delayed ACK\n\n- **Nagle**：如果還有沒被 ack 的小封包，就先把新的小資料攢起來，等 ack 回來再一起送。減少小封包數量\n- **Delayed ACK**：收方不立刻回 ack，等一下（最多約 40ms~200ms），看能不能搭著回應資料一起送\n- 兩者同時作用在「寫-寫-讀」模式時會產生 **~40ms 延遲**\n- 對延遲敏感的程式（遊戲、RPC）會設定 `TCP_NODELAY` 關掉 Nagle\n- 更好的作法：把要送的資料組好，**一次** `send()` 出去（P2 參考解答把 header + payload 串起來一起送，就是這個原因）\n\n## 8. 自我檢查\n\n1. 用一句話說明為什麼 TCP 會有「黏包」問題。\n2. server 呼叫 `accept()` 之前，三次握手完成了嗎？\n3. `recv()` 回傳 0、回傳 -1、阻塞住不回傳，分別代表什麼？\n4. 誰會進入 TIME_WAIT？為什麼要等 2MSL？\n5. 一台機器上看到 5,000 條 CLOSE_WAIT，最可能是什麼問題？\n6. 為什麼 `send()` 回傳成功，不代表對方已經收到資料？\n"}, {"path": "materials/02-socket-api-c.md", "title": "02. Berkeley Socket API (C 語言)", "group": "教材", "spoiler": false, "md": "# 02. Berkeley Socket API (C 語言)\n\n> P1 的必備知識。所有函式都可以 `man 2 <函式名>` 查詢。\n\n## 1. 整體流程\n\n```\n         Server                             Client\n   ┌──────────────┐                   ┌──────────────┐\n   │   socket()   │                   │   socket()   │\n   └──────┬───────┘                   └──────┬───────┘\n   ┌──────▼───────┐                          │\n   │ setsockopt() │ SO_REUSEADDR             │\n   └──────┬───────┘                          │\n   ┌──────▼───────┐                          │\n   │    bind()    │ 綁定 IP:port             │\n   └──────┬───────┘                          │\n   ┌──────▼───────┐                          │\n   │   listen()   │ 開始接受連線             │\n   └──────┬───────┘                          │\n   ┌──────▼───────┐  3-way handshake  ┌──────▼───────┐\n   │   accept()   │◄──────────────────│  connect()   │\n   └──────┬───────┘                   └──────┬───────┘\n          │ 回傳「新的」fd                   │\n   ┌──────▼───────┐       資料        ┌──────▼───────┐\n   │ recv / send  │◄═════════════════►│ send / recv  │\n   └──────┬───────┘                   └──────┬───────┘\n   ┌──────▼───────┐                   ┌──────▼───────┐\n   │   close()    │                   │   close()    │\n   └──────────────┘                   └──────────────┘\n```\n\n**重點**：`accept()` 回傳一個**新的** file descriptor 代表這條連線；原本的 listening socket\n繼續留著，用來接受下一條連線。\n\n## 2. 標頭檔\n\n```c\n#define _POSIX_C_SOURCE 200809L  /* 用 -std=c99 編譯時，要加這行才看得到 POSIX 函式 */\n#include <sys/types.h>\n#include <sys/socket.h>   /* socket, bind, listen, accept, connect, send, recv, setsockopt */\n#include <netinet/in.h>   /* struct sockaddr_in, htons, INADDR_ANY */\n#include <arpa/inet.h>    /* inet_pton, inet_ntop */\n#include <unistd.h>       /* close */\n#include <errno.h>\n```\n\n## 3. 位址結構\n\n```c\nstruct sockaddr_in {          /* IPv4 專用 */\n    sa_family_t    sin_family;  /* AF_INET */\n    in_port_t      sin_port;    /* port，network byte order！ */\n    struct in_addr sin_addr;    /* IP，network byte order！ */\n    /* ... padding ... */\n};\n```\n\n`bind` / `connect` / `accept` 的參數型別是通用的 `struct sockaddr *`，所以要轉型：\n\n```c\nstruct sockaddr_in addr;\nmemset(&addr, 0, sizeof(addr));           /* 一定要清零 */\naddr.sin_family = AF_INET;\naddr.sin_port = htons(9000);\naddr.sin_addr.s_addr = htonl(INADDR_ANY); /* 0.0.0.0 = 所有網卡 */\nbind(fd, (struct sockaddr *)&addr, sizeof(addr));\n```\n\nIPv6 用 `struct sockaddr_in6`；要同時支援兩者，用 `struct sockaddr_storage` 或 `getaddrinfo()`。\n\n## 4. Byte order (位元組順序)\n\n多 byte 的整數在記憶體中有兩種存法：\n\n```\n0x12345678\nbig-endian    (網路標準):  12 34 56 78\nlittle-endian (x86, ARM):  78 56 34 12\n```\n\n網路協定一律使用 **big-endian（network byte order）**。轉換函式：\n\n| 函式 | 意義 | 用途 |\n|------|------|------|\n| `htons()` | host to network short (16 bit) | port |\n| `htonl()` | host to network long (32 bit) | IPv4 位址 |\n| `ntohs()` / `ntohl()` | 反方向 | 從 `accept` 取得的位址轉回來印 |\n\n> **P1 Bug**：`addr.sin_port = port;` 少了 `htons()`。在 big-endian 機器上剛好會動，\n> 在 x86 上 port 9000 (`0x2328`) 會變成 10275 (`0x2823`)。\n\nIP 位址字串與二進位互轉：\n```c\ninet_pton(AF_INET, \"127.0.0.1\", &addr.sin_addr);   /* presentation → network，成功回傳 1 */\nchar ip[INET_ADDRSTRLEN];\ninet_ntop(AF_INET, &addr.sin_addr, ip, sizeof(ip)); /* network → presentation */\n```\n（舊的 `inet_addr()` / `inet_ntoa()` 不支援 IPv6、而且 `inet_ntoa` 不是 thread-safe，不要用）\n\n## 5. 函式一覽\n\n### `socket()`\n```c\nint fd = socket(AF_INET, SOCK_STREAM, 0);   /* IPv4 + TCP */\n/* AF_INET6 = IPv6；SOCK_DGRAM = UDP；失敗回傳 -1 */\n```\n\n### `setsockopt()` 與 `SO_REUSEADDR`\n```c\nint opt = 1;\nsetsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &opt, sizeof(opt));   /* 必須在 bind() 之前 */\n```\n允許 bind 一個還有 TIME_WAIT 連線的 port。**幾乎所有 server 都應該設**。\n（`SO_REUSEPORT` 是另一個東西：讓多個 process 同時 bind 同一個 port，由 kernel 做負載平衡）\n\n> Windows 的 `SO_REUSEADDR` 語意不同（允許搶別人正在用的 port），Windows 上的對應是 `SO_EXCLUSIVEADDRUSE`。\n\n### `bind()` / `listen()`\n```c\nif (bind(fd, (struct sockaddr *)&addr, sizeof(addr)) < 0) { perror(\"bind\"); exit(1); }\nif (listen(fd, 16) < 0) { perror(\"listen\"); exit(1); }   /* 16 = backlog */\n```\n常見錯誤：`EADDRINUSE`（port 被佔用或 TIME_WAIT）、`EACCES`（非 root 綁定 < 1024 的 port）。\n\n### `accept()`\n```c\nstruct sockaddr_in cli;\nsocklen_t len = sizeof(cli);           /* 進去時是 buffer 大小，出來時是實際大小 */\nint cfd = accept(fd, (struct sockaddr *)&cli, &len);\n/* 不在乎對方位址可以傳 NULL, NULL */\n```\n\n### `connect()`\n```c\nif (connect(fd, (struct sockaddr *)&addr, sizeof(addr)) < 0) perror(\"connect\");\n/* ECONNREFUSED: 對方那個 port 沒有人 listen；ETIMEDOUT: 封包石沉大海 */\n```\n\n### `send()` / `recv()`\n```c\nssize_t n = send(fd, buf, len, 0);   /* 回傳實際「複製進 send buffer」的 bytes，可能 < len */\nssize_t n = recv(fd, buf, cap, 0);   /* 回傳實際收到的 bytes，可能 < cap */\n```\n\n| `recv()` 回傳值 | 意義 |\n|-----------------|------|\n| `> 0` | 收到 n bytes（**不一定**是對方一次 send 的量） |\n| `== 0` | 對方關閉連線（收到 FIN）。**一定要處理，否則會無窮迴圈** |\n| `-1` + `errno == EINTR` | 被 signal 打斷，重試即可 |\n| `-1` + `errno == EAGAIN/EWOULDBLOCK` | non-blocking socket 目前沒資料 |\n| `-1` + `errno == ECONNRESET` | 對方送了 RST（異常中斷） |\n\n`send()` / `recv()` 等同於 `write()` / `read()` 加上 flags 參數；flags 填 0 時效果一樣。\n\n### `close()` / `shutdown()`\n```c\nclose(fd);                 /* 釋放 fd；這是最後一個參照時送出 FIN */\nshutdown(fd, SHUT_WR);     /* 只關閉寫方向 (half-close)，還能繼續 recv */\n```\n\n## 6. 三個一定要會的「完整」模式\n\n### 6.1 `send_all`：處理 partial send\n\n```c\nstatic int send_all(int fd, const char *buf, size_t len)\n{\n    size_t sent = 0;\n    while (sent < len) {\n        ssize_t n = send(fd, buf + sent, len - sent, 0);\n        if (n < 0) {\n            if (errno == EINTR) continue;\n            return -1;\n        }\n        sent += (size_t)n;\n    }\n    return 0;\n}\n```\n\n### 6.2 `recv_all`：剛好收 n bytes\n\n```c\nstatic ssize_t recv_all(int fd, char *buf, size_t len)\n{\n    size_t got = 0;\n    while (got < len) {\n        ssize_t n = recv(fd, buf + got, len - got, 0);\n        if (n < 0) {\n            if (errno == EINTR) continue;\n            return -1;\n        }\n        if (n == 0) break;      /* 對方關閉，回傳已收到的量 */\n        got += (size_t)n;\n    }\n    return (ssize_t)got;\n}\n```\n（`recv` 有個 `MSG_WAITALL` flag 有類似效果，但被 signal 打斷時仍可能提早返回，不能完全依賴）\n\n### 6.3 Server 主迴圈\n\n```c\nfor (;;) {\n    int cfd = accept(lfd, NULL, NULL);\n    if (cfd < 0) {\n        if (errno == EINTR) continue;\n        perror(\"accept\");\n        continue;\n    }\n    handle_client(cfd);   /* 裡面要處理 recv()==0，最後 close(cfd) */\n}\n```\n\n## 7. SIGPIPE\n\n對一條「對方已經關閉」的連線 `send()`，第一次可能成功，對方回 RST；\n再 `send()` 一次，kernel 會送你 **SIGPIPE**，預設行為是**直接終止 process**——\nserver 會無聲無息地死掉。\n\n```c\nsignal(SIGPIPE, SIG_IGN);           /* 全域忽略，send() 改為回傳 -1, errno = EPIPE */\nsend(fd, buf, len, MSG_NOSIGNAL);   /* 或者每次 send 時指定 (Linux) */\n```\n\n（Python 預設就忽略 SIGPIPE，會改 raise `BrokenPipeError`）\n\n## 8. 錯誤處理習慣\n\n```c\nif (bind(...) < 0) {\n    perror(\"bind\");    /* 會印出 \"bind: Address already in use\" */\n    exit(1);\n}\n```\n- 每一個 socket 系統呼叫都要檢查回傳值\n- `perror` / `strerror(errno)` 印出人看得懂的錯誤\n- `errno` 只在函式**失敗時**有意義，成功時可能是殘留的舊值\n\n## 9. 同時服務多個 client（P1 的延伸）\n\nP1 是 iterative server：服務完一個才服務下一個。常見改法：\n\n```c\n/* fork 版：每條連線一個 process */\nsignal(SIGCHLD, SIG_IGN);              /* 自動回收子 process，避免 zombie */\nfor (;;) {\n    int cfd = accept(lfd, NULL, NULL);\n    if (cfd < 0) continue;\n    pid_t pid = fork();\n    if (pid == 0) {          /* child */\n        close(lfd);          /* child 不需要 listening socket */\n        handle_client(cfd);\n        _exit(0);\n    }\n    close(cfd);              /* parent 一定要關掉，否則連線永遠不會結束 */\n}\n```\n\n其他方法（pthread、select/poll/epoll）見 [05-concurrency-models.md](05-concurrency-models.md)。\n\n## 10. 練習\n\n1. 不設定 `SO_REUSEADDR`，啟動 server → 用 `nc` 連線 → Ctrl+C 關掉 server → 立刻重啟，觀察錯誤訊息；再用 `ss -tan | grep TIME-WAIT` 看看\n2. 把 P1 server 改成 fork 版本，用三個 `nc` 同時連線測試\n3. 用 `getaddrinfo()` 改寫 client，讓它能接受 `localhost` 這種主機名稱，並同時支援 IPv4/IPv6\n"}, {"path": "materials/03-python-socket.md", "title": "03. Python socket 程式設計", "group": "教材", "spoiler": false, "md": "# 03. Python socket 程式設計\n\n> Python 的 `socket` 模組幾乎是 C API 一對一的包裝，所以 02 學到的觀念全部適用。\n> 差別在於：錯誤變成 exception、位址變成 tuple、不需要手動處理 byte order 的位址轉換。\n\n## 1. C 與 Python 對照\n\n| C | Python |\n|---|--------|\n| `socket(AF_INET, SOCK_STREAM, 0)` | `socket.socket(socket.AF_INET, socket.SOCK_STREAM)` |\n| `setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &one, ...)` | `s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)` |\n| `bind(fd, &addr, len)` + `htons` | `s.bind((\"0.0.0.0\", 9000))` |\n| `listen(fd, 16)` | `s.listen(16)` |\n| `accept(fd, &cli, &len)` | `conn, (ip, port) = s.accept()` |\n| `connect(fd, &addr, len)` | `s.connect((\"127.0.0.1\", 9000))` |\n| `send` / `recv` | `s.send(b)` / `s.recv(n)` |\n| 自己寫的 `send_all` | **`s.sendall(b)`** |\n| `recv() == 0` | `s.recv(n) == b\"\"` |\n| `errno == EINTR` | Python 3.5+ 自動重試 (PEP 475) |\n| `errno == EAGAIN` | `BlockingIOError` |\n| `errno == ECONNRESET` | `ConnectionResetError` |\n| `errno == EPIPE` | `BrokenPipeError` |\n| `errno == ECONNREFUSED` | `ConnectionRefusedError` |\n| `close(fd)` | `s.close()` 或 `with s:` |\n\n## 2. 最小的 echo server / client\n\n```python\nimport socket\n\nwith socket.socket(socket.AF_INET, socket.SOCK_STREAM) as lsock:\n    lsock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n    lsock.bind((\"127.0.0.1\", 9000))\n    lsock.listen()\n    while True:\n        conn, addr = lsock.accept()\n        with conn:\n            print(\"connected\", addr)\n            while True:\n                data = conn.recv(4096)\n                if not data:          # b\"\" → 對方關閉\n                    break\n                conn.sendall(data)\n```\n\n```python\nimport socket\n\nwith socket.create_connection((\"127.0.0.1\", 9000), timeout=5) as s:\n    s.sendall(b\"hello\\n\")\n    print(s.recv(4096))       # ⚠ 不保證收到完整的 b\"hello\\n\"！\n```\n\n`socket.create_connection()` 會處理主機名稱解析、IPv4/IPv6，比手動 `connect` 方便。\n`socket.create_server((\"\", 9000))`（3.8+）也會自動幫你設 `SO_REUSEADDR`（POSIX 上）。\n\n## 3. `send` vs `sendall`\n\n```python\nn = s.send(data)     # 回傳實際送出的 bytes，可能 < len(data)\ns.sendall(data)      # 迴圈送到完為止，失敗 raise exception；成功回傳 None\n```\n\n**blocking socket 一律用 `sendall`**。`send` 只在 non-blocking 情境（P3）中使用，\n因為你需要知道送出了多少、剩下的存起來。\n\n> 用 `sendall` 時如果 socket 有設定 timeout 而逾時了，你**無法得知**送出了多少。\n\n## 4. `recv` 永遠可能「不夠」\n\n`recv(4096)` 的意思是「**最多**給我 4096 bytes」，可能只給你 1 byte。\n需要固定長度的資料時，自己寫迴圈：\n\n```python\ndef recv_exact(sock, n):\n    buf = bytearray()\n    while len(buf) < n:\n        chunk = sock.recv(n - len(buf))   # 只要求「還缺的量」，避免多讀\n        if not chunk:\n            raise ConnectionError(\"connection closed early\")\n        buf += chunk\n    return bytes(buf)\n```\n\n> 用 `bytes +=` 在迴圈裡拼接是 O(n²)；資料大時用 `bytearray` 或 list + `b\"\".join()`。\n\n## 5. 以行為單位的資料：`makefile()`\n\n把 socket 包成 file-like 物件，就能用 `readline()` 或 `for line in f`：\n\n```python\nwith conn.makefile(\"r\", encoding=\"utf-8\", newline=\"\\n\") as f:\n    for line in f:          # 自動處理半包、黏包\n        handle(line.rstrip(\"\\n\"))\n```\n\n方便，但只適用於 **blocking** socket。P3 是 non-blocking，必須自己切行。\n\n## 6. Timeout\n\n```python\ns.settimeout(5.0)     # 之後的 recv/send/accept/connect 超過 5 秒 raise socket.timeout\ns.settimeout(None)    # blocking (預設)\ns.settimeout(0)       # 等同 setblocking(False)\n```\n\n- Python 3.10 起 `socket.timeout` 是 `TimeoutError` 的別名，而 `TimeoutError` 是 `OSError` 的子類別\n- 所以 `except OSError` 會**吃掉** timeout。需要區分的話，`except socket.timeout` 要寫在前面（P4 TODO 4-B）\n- 逾時後 socket 的狀態可能不確定（例如讀到一半的訊息），通常應該直接關閉連線\n\n```python\ntry:\n    data = conn.recv(4096)\nexcept socket.timeout:\n    ...            # 閒置太久\nexcept ConnectionResetError:\n    ...            # 對方 RST\nexcept OSError as e:\n    ...            # 其他錯誤\n```\n\n## 7. 例外階層 (節錄)\n\n```\nOSError\n ├── BlockingIOError           (EAGAIN / EWOULDBLOCK)\n ├── InterruptedError          (EINTR，3.5 後很少見)\n ├── TimeoutError  (= socket.timeout)\n └── ConnectionError\n      ├── BrokenPipeError       (EPIPE)\n      ├── ConnectionAbortedError\n      ├── ConnectionRefusedError (ECONNREFUSED)\n      └── ConnectionResetError   (ECONNRESET)\n```\n\n## 8. bytes 與 str\n\nsocket 只認識 **bytes**。\n\n```python\ns.sendall(\"你好\\n\".encode(\"utf-8\"))      # str → bytes\ntext = data.decode(\"utf-8\")               # bytes → str\n```\n\n⚠ 不要對**半包**做 decode：一個中文字在 UTF-8 是 3 bytes，可能剛好被切成兩半 →\n`UnicodeDecodeError`。正確作法是先用 bytes 切出完整的訊息/行，再 decode（P3 就是這樣做的）。\n\n## 9. `struct`：打包二進位資料\n\n```python\nimport struct\nstruct.pack(\"!I\", 5)            # b'\\x00\\x00\\x00\\x05'   ! = network byte order\nstruct.pack(\"<I\", 5)            # b'\\x05\\x00\\x00\\x00'   < = little-endian\nstruct.unpack(\"!I\", b\"\\x00\\x00\\x00\\x05\")   # (5,)  注意回傳 tuple\nH = struct.Struct(\"!HI\")        # 預先編譯：unsigned short + unsigned int\nH.size                           # 6\n```\n\n| 字元 | C 型別 | 大小 (standard) |\n|------|--------|----------------|\n| `B` | unsigned char | 1 |\n| `H` | unsigned short | 2 |\n| `I` | unsigned int | 4 |\n| `Q` | unsigned long long | 8 |\n| `s` | char[] | 指定長度，如 `16s` |\n\n> **P2 Bug**：沒加 `!` 的 `\"I\"` 是 native byte order，在 x86 上就是 little-endian。\n\n## 10. 多執行緒基礎\n\n```python\nimport threading\n\ndef handle(conn, addr):\n    with conn:\n        ...\n\nwhile True:\n    conn, addr = lsock.accept()\n    threading.Thread(target=handle, args=(conn, addr), daemon=True).start()\n```\n\n- `daemon=True`：主程式結束時不用等這些 thread\n- 同一個 socket 可以一條 thread 收、一條 thread 送（全雙工）\n- 多條 thread 共用的資料要上鎖 → 見 [05-concurrency-models.md](05-concurrency-models.md)\n\n## 11. 練習\n\n1. 用 `makefile()` 寫一個 line-based echo server，用 `nc` 測試一次貼上多行文字\n2. 寫一個 client，連到 `example.com:80`，手動送出 `GET / HTTP/1.1\\r\\nHost: example.com\\r\\nConnection: close\\r\\n\\r\\n`，印出完整回應\n3. 故意不設 `SO_REUSEADDR`，觀察 Python 會 raise 什麼 exception\n"}, {"path": "materials/04-message-framing.md", "title": "04. 訊息邊界 (Message Framing)", "group": "教材", "spoiler": false, "md": "# 04. 訊息邊界 (Message Framing)\n\n> TCP 給你的是一條 byte 的水管，不是一個一個的信封。\n> 「一則訊息從哪裡開始、到哪裡結束」必須由應用層協定自己定義。這是 P2 的核心。\n\n## 1. 問題重現\n\n```python\n# sender\nsock.sendall(b\"hello\")\nsock.sendall(b\"world\")\n\n# receiver：以下每一種結果都是合法的\nsock.recv(1024)  → b\"helloworld\"             # 黏包\nsock.recv(1024)  → b\"hel\", 之後 b\"loworld\"   # 半包 + 黏包\nsock.recv(1024)  → b\"hello\", 之後 b\"world\"   # 你「期待」的結果，但只是剛好\n```\n\n在 localhost 上測試，幾乎總是得到第三種結果，於是程式「看起來」是對的。\n上了真實網路（或碰到 judge 故意把資料切碎）才會出錯。\n\n## 2. 三種常見的切分方法\n\n### 2.1 固定長度\n\n每則訊息都剛好 N bytes。簡單，但浪費空間、不能放可變長度資料。\n適合：固定格式的二進位封包（例如某些遊戲、感測器資料）。\n\n### 2.2 分隔符號 (delimiter)\n\n用特殊字元標示結尾，最常見是 `\\n` 或 `\\r\\n`。\n\n```\nNICK alice\\n\nhello everyone\\n\n```\n\n- 優點：人類可讀，可以用 `nc` / `telnet` 直接測試\n- 缺點：payload 裡不能出現分隔符號（或需要跳脫）；必須逐 byte 掃描\n- 實例：HTTP header、SMTP、Redis 的 RESP 協定、**P3 聊天室**\n\n接收端的標準寫法：\n\n```python\nbuffer = b\"\"\nwhile True:\n    data = sock.recv(4096)\n    if not data:\n        break\n    buffer += data\n    while b\"\\n\" in buffer:\n        line, buffer = buffer.split(b\"\\n\", 1)   # 只切第一個\n        handle(line)\n    # 迴圈結束時，buffer 裡可能還有「不完整的一行」，留到下一輪\n```\n\n別忘了限制 buffer 長度：惡意 client 送 1GB 都不換行，你的記憶體就爆了。\n\n### 2.3 長度前綴 (length-prefix)\n\n先送固定大小的 header 表示 payload 長度，再送 payload。\n\n```\n+-------------------+---------------------------+\n| length (4 bytes)  | payload (length bytes)    |\n+-------------------+---------------------------+\n00 00 00 05  68 65 6c 6c 6f       →  b\"hello\"\n00 00 00 00                       →  b\"\"  (空訊息)\n```\n\n- 優點：payload 可以是任意二進位資料；接收端知道要讀多少，不用掃描\n- 缺點：人類不可讀；header 錯一個 byte 整條串流就錯位了\n- 實例：**P2 / P4**、TLS record、HTTP/2 frame、gRPC、Kafka、PostgreSQL 協定\n\nHTTP/1.1 其實是**混合**：header 用 `\\r\\n\\r\\n` 分隔，body 用 `Content-Length`（長度前綴）或 `chunked` 編碼。\n\n## 3. Length-prefix 的完整實作\n\n```python\nimport struct\n\nHEADER = struct.Struct(\"!I\")       # 4 bytes, big-endian, unsigned\nMAX_MSG_SIZE = 16 * 1024 * 1024\n\ndef send_msg(sock, payload: bytes):\n    if len(payload) > MAX_MSG_SIZE:\n        raise ValueError(\"too large\")\n    sock.sendall(HEADER.pack(len(payload)) + payload)\n\ndef recv_exact(sock, n):\n    chunks, remaining = [], n\n    while remaining:\n        chunk = sock.recv(min(remaining, 65536))\n        if not chunk:\n            raise ConnectionError(\"closed in the middle of a message\")\n        chunks.append(chunk)\n        remaining -= len(chunk)\n    return b\"\".join(chunks)\n\ndef recv_msg(sock):\n    first = sock.recv(HEADER.size)\n    if not first:\n        return None                        # 在訊息與訊息之間正常關閉\n    header = first + recv_exact(sock, HEADER.size - len(first))\n    (length,) = HEADER.unpack(header)\n    if length > MAX_MSG_SIZE:\n        raise ValueError(\"too large\")      # 先檢查，再讀！\n    return recv_exact(sock, length)\n```\n\n### 每一行背後的考量\n\n| 細節 | 為什麼 |\n|------|--------|\n| `\"!I\"` 而不是 `\"I\"` | 雙方的 CPU 可能 endian 不同，網路協定一律 big-endian |\n| `recv(min(remaining, ...))` | 只讀「還缺的量」，不然會吃掉下一則訊息的開頭 |\n| 區分 `None` 與 `ConnectionError` | 呼叫端需要知道是「正常結束」還是「傳輸失敗」 |\n| 空訊息回傳 `b\"\"` 不是 `None` | `b\"\"` 和「連線結束」是兩回事，`if not msg` 會把兩者混為一談 |\n| 讀 payload 前檢查 `MAX_MSG_SIZE` | 否則對方送 `FF FF FF FF` 就能讓你嘗試配置 4 GiB 記憶體 (DoS) |\n| header + payload 一次 `sendall` | 減少系統呼叫，也避免 Nagle + delayed ACK 造成延遲 |\n\n## 4. 串流錯位 (desync)\n\n一旦你多讀或少讀了任何一個 byte，之後所有的 header 都會被解讀成錯誤的長度。\n這就是為什麼 P4 在遇到 `ProtocolError` 時必須**斷線**：\n\n| 錯誤 | 串流狀態 | 處理方式 |\n|------|---------|---------|\n| payload 不是合法 JSON | 已依 length 讀完整則訊息，**仍然對齊** | 回錯誤訊息，繼續服務 |\n| length 超過上限 | payload 沒讀，**已經錯位** | 只能斷線 |\n| 讀到一半逾時 | 不知道讀到哪，**已經錯位** | 只能斷線 |\n\n## 5. 在 framing 之上：序列化格式\n\nframing 決定「一則訊息的邊界」，序列化決定「訊息內容怎麼表示」：\n\n| 格式 | 特性 |\n|------|------|\n| JSON | 人類可讀、通用，但體積大、沒有 schema、不能直接放二進位資料 |\n| MessagePack / CBOR | 二進位的 JSON，較小較快 |\n| Protocol Buffers / FlatBuffers | 有 schema、跨語言、向後相容、體積小 |\n| 自訂二進位 (`struct`) | 最省空間，但演進困難 |\n\nP4 使用「length-prefix + JSON」，是很多內部 RPC 的實際做法。\n\n## 6. 練習\n\n1. 用 C 寫一個與 P2 相容的 `send_msg` / `recv_msg`，並用 Python 的 P2 實作和它互傳訊息\n2. 修改協定：header 改成 `type (1 byte) + length (4 bytes)`，用 type 區分 JSON 與二進位檔案\n3. 如果要支援超過 4 GiB 的訊息，你會怎麼修改格式？（提示：`Q`、或 varint）\n"}, {"path": "materials/05-concurrency-models.md", "title": "05. 併發模型：如何同時服務多個 client", "group": "教材", "spoiler": false, "md": "# 05. 併發模型：如何同時服務多個 client\n\n> P1 一次只能服務一個 client。P3 用單執行緒 + I/O multiplexing，P4 用多執行緒。\n> 這一章比較各種作法，以及多執行緒帶來的 race condition。\n\n## 1. 問題：blocking I/O\n\n```python\nconn, _ = lsock.accept()   # 卡在這裡等新連線\ndata = conn.recv(4096)     # 卡在這裡等這個 client 送資料\n```\n\n一條 thread 一次只能卡在一個地方。如果卡在 client A 的 `recv()`，client B 送來的資料就沒人處理。\n\n## 2. 五種模型比較\n\n| 模型 | 作法 | 優點 | 缺點 |\n|------|------|------|------|\n| Iterative | 一次一個 | 最簡單 | 完全不能併發 (P1) |\n| Process per connection | `fork()` | 隔離性好，一個掛掉不影響其他 | process 很重；共享資料要 IPC |\n| Thread per connection | `pthread_create` / `threading.Thread` | 程式好寫（每條連線就是一段 blocking 的流程）| 每條 thread 有自己的 stack (Linux 預設 8 MB 虛擬記憶體)；context switch；**共享資料要上鎖** (P4) |\n| Thread pool | 固定 N 條 thread 從 queue 拿工作 | 限制資源用量 | 連線數 > N 時，閒置連線會佔住 thread |\n| Event-driven / I/O multiplexing | `select` / `poll` / `epoll` + non-blocking | 單執行緒就能撐上萬條連線，沒有鎖的問題 | 程式要拆成 callback / 狀態機，比較難寫 (P3) |\n\n現代高效能 server（nginx、Redis、Node.js、Go runtime、Python asyncio）幾乎都以 event-driven 為核心，\n再搭配多個 worker 吃滿多核心。\n\n## 3. I/O Multiplexing\n\n核心想法：**問 kernel「這一堆 socket 裡，哪些現在可以讀/寫而不會阻塞？」**，只處理準備好的那些。\n\n```\n         ┌────────────── event loop ──────────────┐\n         │                                        │\n         ▼                                        │\n   select([lsock, c1, c2, c3])  ← 阻塞在這裡，直到至少一個 ready\n         │\n         ├─ lsock 可讀  → accept()，把新連線加入監聽清單\n         ├─ c2 可讀     → recv()，一定馬上有資料 (或 EOF)\n         └─ c3 可寫     → send() 把 outbuf 的資料送出去\n```\n\n| 系統呼叫 | 特性 |\n|---------|------|\n| `select` | 最古老、可攜；fd 數量上限 (FD_SETSIZE，通常 1024)；每次 O(n) |\n| `poll` | 沒有數量上限，但每次仍 O(n) |\n| `epoll` (Linux) / `kqueue` (BSD/macOS) | 註冊一次、只回傳 ready 的 fd，O(ready)；C10K 的解法 |\n| IOCP (Windows) | completion-based，模型不同 |\n\nPython 的 `selectors.DefaultSelector` 會自動挑該平台最好的實作。\n\n### 「可讀」代表什麼？\n\n- listening socket 可讀 → 有新連線可以 `accept()`\n- 一般 socket 可讀 → 有資料、**或對方關閉了**（此時 `recv()` 回傳 `b\"\"`）、或發生錯誤\n\n### 「可寫」代表什麼？\n\nsend buffer 有空間。**幾乎永遠成立**，所以只在有資料要送時才監聽 `EVENT_WRITE`，\n送完就取消，否則 `select()` 每次都立刻返回 → busy loop、CPU 100%（P3 TODO 3-E）。\n\n## 4. Python `selectors` 用法\n\n```python\nimport selectors, socket\n\nsel = selectors.DefaultSelector()\n\nlsock = socket.socket()\nlsock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\nlsock.bind((\"127.0.0.1\", 9000))\nlsock.listen()\nlsock.setblocking(False)\nsel.register(lsock, selectors.EVENT_READ, data=None)   # data 可以放任何東西\n\nwhile True:\n    for key, mask in sel.select(timeout=1.0):\n        if key.data is None:                  # listening socket\n            conn, addr = lsock.accept()\n            conn.setblocking(False)\n            sel.register(conn, selectors.EVENT_READ, data={\"out\": b\"\"})\n        else:\n            conn, state = key.fileobj, key.data\n            if mask & selectors.EVENT_READ:\n                data = conn.recv(4096)\n                if not data:\n                    sel.unregister(conn)       # 先 unregister 再 close\n                    conn.close()\n                    continue\n                state[\"out\"] += data          # echo：放進 outbuf\n                sel.modify(conn, selectors.EVENT_READ | selectors.EVENT_WRITE, data=state)\n            if mask & selectors.EVENT_WRITE:\n                n = conn.send(state[\"out\"])   # non-blocking：可能只送出一部分\n                state[\"out\"] = state[\"out\"][n:]\n                if not state[\"out\"]:\n                    sel.modify(conn, selectors.EVENT_READ, data=state)\n```\n\n### Non-blocking 的三個鐵則\n\n1. **每條連線要有自己的 input buffer**：資料可能只來一半（半包）\n2. **每條連線要有自己的 output buffer**：`send()` 可能只送出一部分\n3. **handler 裡絕對不能有 blocking 呼叫**：一個 `time.sleep(1)` 或 `sendall()` 就會讓所有 client 一起卡住\n\n### 慢速 client 問題\n\n如果某個 client 一直不 `recv()`，它的 outbuf 會無限增長。實務上要設上限，超過就斷線。\n（EXAM.md 加分思考題 2）\n\n## 5. Race Condition 與 Lock\n\n多條 thread 共享資料時，「讀 → 改 → 寫回」不是一個不可分割的動作：\n\n```python\n# 兩條 thread 同時執行 counter += 1\ncur = data[\"counter\"]        # A 讀到 0        B 讀到 0\ndata[\"counter\"] = cur + 1    # A 寫入 1        B 寫入 1   ← A 的更新消失了\n```\n\n這叫 **lost update**。解法是用 **mutex (互斥鎖)** 把臨界區段 (critical section) 保護起來：\n\n```python\nlock = threading.Lock()          # ← 所有 thread 共用「同一把」鎖\n\ndef incr(key):\n    with lock:                   # 同一時間只有一條 thread 能進來\n        cur = data.get(key, 0)\n        data[key] = cur + 1\n```\n\n### P4 的 bug\n\n```python\ndef incr(self, key, by=1):\n    with threading.Lock():       # ✘ 每次都建立一把「新的」鎖\n```\n\n每條 thread 都拿到一把只有自己有的鎖，當然每次都能馬上拿到 → 等於沒鎖。\n**鎖必須是共享的**才有意義。\n\n### 「Python 有 GIL，所以不用鎖？」—— 錯\n\nGIL 只保證**一次只有一條 thread 執行 Python bytecode**，但 thread 可以在任兩個 bytecode 之間被切換。\n`counter += 1` 是好幾個 bytecode（LOAD、ADD、STORE），中間可能被切走。\n加上 I/O（如 P4 的 `_simulate_disk_latency`）時 GIL 會被釋放，race 幾乎必定發生。\n（而 Python 3.13 起還有可以關掉 GIL 的 free-threaded build。）\n\n### 常見的鎖相關問題\n\n| 問題 | 說明 | 預防 |\n|------|------|------|\n| Deadlock | A 拿著鎖 1 等鎖 2，B 拿著鎖 2 等鎖 1 | 固定上鎖順序；用 `with` 確保釋放 |\n| 拿著鎖做 I/O | 在鎖裡 `sendall()`，一個慢 client 卡住所有人 | 鎖內只做記憶體操作 |\n| 鎖的粒度太粗 | 一把全域鎖讓所有操作排隊 | lock striping、讀寫鎖 |\n| 忘記鎖讀取 | 「只是讀而已」也可能讀到寫到一半的狀態 | 讀寫都要保護 |\n\n### C 語言的對應 (pthread)\n\n```c\n#include <pthread.h>\nstatic pthread_mutex_t lock = PTHREAD_MUTEX_INITIALIZER;\nstatic long counter = 0;\n\nvoid *worker(void *arg) {\n    pthread_mutex_lock(&lock);\n    counter++;\n    pthread_mutex_unlock(&lock);\n    return NULL;\n}\n/* 編譯時加 -pthread */\n```\n\n## 6. asyncio：另一種寫法\n\nasyncio 是 event-driven 模型，但讓你用「看起來像 blocking」的方式寫程式：\n\n```python\nimport asyncio\n\nasync def handle(reader, writer):\n    while line := await reader.readline():   # await = 交出控制權給 event loop\n        writer.write(line)\n        await writer.drain()                 # 等 outbuf 降下來 (back-pressure)\n    writer.close()\n    await writer.wait_closed()\n\nasync def main():\n    server = await asyncio.start_server(handle, \"127.0.0.1\", 9000)\n    async with server:\n        await server.serve_forever()\n\nasyncio.run(main())\n```\n\n底層就是 selectors + 每條連線的 buffer，只是 asyncio 幫你管理好了。\n親手寫過 P3，才會懂 `await writer.drain()` 在做什麼。\n\n## 7. 練習\n\n1. 用 `threading` 改寫 P3，比較程式碼長度與需要上鎖的地方\n2. 用 asyncio 重寫 P3\n3. 把 P4 的 `incr` 鎖拿掉，跑 judge 看看 counter 少了多少；再把 `_simulate_disk_latency` 也拿掉，再跑幾次\n4. 寫一個 C 程式：兩條 pthread 各自把共享變數 +1 一百萬次，不加鎖印出結果，再加鎖比較\n"}, {"path": "materials/06-debugging-tools.md", "title": "06. 除錯工具與常見錯誤", "group": "教材", "spoiler": false, "md": "# 06. 除錯工具與常見錯誤\n\n> 上機考時間有限，「能快速看出哪裡壞了」比「寫得快」更重要。\n\n## 1. `nc` (netcat)：萬用的 TCP 瑞士刀\n\n```bash\nnc 127.0.0.1 9000                 # 當 client：連上去，打字送出，收到的印出來\nnc -l 9000                        # 當 server：listen 在 9000 (OpenBSD 版)\nprintf 'alice\\nhello\\n' | nc -q1 127.0.0.1 9000   # 送完等 1 秒再關\nnc -zv 127.0.0.1 9000             # 只檢查 port 有沒有開\n```\n\n測 P1：`./server 9000` + `nc 127.0.0.1 9000`\n測 P3：開三個終端機各跑 `nc 127.0.0.1 9000`，第一行輸入暱稱\n\n在 Windows 上可以用 PowerShell 的 `Test-NetConnection 127.0.0.1 -Port 9000` 檢查 port。\n\n## 2. `ss` / `netstat`：看連線狀態\n\n```bash\nss -tlnp                 # t=TCP l=listening n=不解析名稱 p=顯示 process\nss -tan                  # 所有 TCP 連線與狀態\nss -tan state time-wait  # 只看 TIME_WAIT\nss -tni                  # 加上 RTT、cwnd、send/recv queue 等內部資訊\n```\n\n輸出中的 `Recv-Q` / `Send-Q`：\n- 一般連線：`Recv-Q` 是還沒被應用程式 `recv()` 的資料量、`Send-Q` 是還沒被對方 ack 的資料量\n- listening socket：`Recv-Q` 是 accept queue 裡等著被 `accept()` 的連線數\n\n**常見診斷：**\n| 看到 | 可能原因 |\n|------|---------|\n| 沒有你的 port 在 LISTEN | bind/listen 沒成功、port 寫錯（例如忘了 `htons`！） |\n| LISTEN 的 Recv-Q 一直增加 | server 沒在 `accept()`（卡在處理別的 client？） |\n| 某條連線 Recv-Q 很大 | 應用程式沒在 `recv()` |\n| 大量 CLOSE_WAIT | 程式收到 EOF 後忘了 `close()` |\n| 大量 TIME_WAIT | 正常現象（主動關閉方），量很大時考慮連線重用 |\n\n## 3. `tcpdump` / Wireshark：看真正的封包\n\n```bash\nsudo tcpdump -i lo -nn 'tcp port 9000'          # 看 loopback 上 port 9000 的封包\nsudo tcpdump -i lo -nn -X 'tcp port 9000'       # 加上 hex + ASCII 內容\nsudo tcpdump -i lo -w cap.pcap 'tcp port 9000'  # 存檔，之後用 Wireshark 開\n```\n\n讀懂 tcpdump 輸出：\n\n```\nIP 127.0.0.1.54321 > 127.0.0.1.9000: Flags [S], seq 1000            ← SYN\nIP 127.0.0.1.9000 > 127.0.0.1.54321: Flags [S.], seq 2000, ack 1001 ← SYN+ACK\nIP 127.0.0.1.54321 > 127.0.0.1.9000: Flags [.], ack 2001            ← ACK\nIP 127.0.0.1.54321 > 127.0.0.1.9000: Flags [P.], seq 1001:1007, length 6  ← 資料 (PSH)\nIP 127.0.0.1.9000 > 127.0.0.1.54321: Flags [F.], ...                ← FIN\nIP 127.0.0.1.9000 > 127.0.0.1.54321: Flags [R], ...                 ← RST\n```\n\n| Flag | 意義 |\n|------|------|\n| `S` | SYN |\n| `.` | ACK |\n| `P` | PSH（有資料，請盡快交給應用程式） |\n| `F` | FIN |\n| `R` | RST（重置連線：對方 port 沒人聽、或程式異常關閉） |\n\nWireshark 的 filter：`tcp.port == 9000`、`tcp.flags.reset == 1`；右鍵 → Follow → TCP Stream 可以看到整段對話。\n\n## 4. `strace`：看程式呼叫了哪些系統呼叫\n\n```bash\nstrace -f -e trace=network ./server 9000\nstrace -f -e trace=socket,bind,listen,accept,recvfrom,sendto ./server 9000\n```\n\n輸出範例：\n```\nsocket(AF_INET, SOCK_STREAM, IPPROTO_IP) = 3\nbind(3, {sa_family=AF_INET, sin_port=htons(10275), ...}, 16) = 0   ← port 不對！\nlisten(3, 16) = 0\n```\n\n上面這個例子一眼就能看出 P1 的 `htons` bug。strace 也是找「程式卡在哪」的好工具：\n卡住的程式最後一行通常是 `accept(...` 或 `recvfrom(...` 沒有回傳值。\n\n## 5. 常見錯誤訊息速查\n\n| 錯誤 | errno | 常見原因 | 解法 |\n|------|-------|---------|------|\n| Address already in use | `EADDRINUSE` | port 被佔用 / TIME_WAIT | `SO_REUSEADDR`；`ss -tlnp` 找出誰在用 |\n| Connection refused | `ECONNREFUSED` | 目標 port 沒有人 listen（對方回 RST） | 確認 server 有啟動、port 正確 |\n| Connection reset by peer | `ECONNRESET` | 對方異常關閉、或關閉時還有沒讀的資料 | 視為斷線處理 |\n| Broken pipe | `EPIPE` | 寫入已關閉的連線 | 忽略 SIGPIPE，視為斷線 |\n| Connection timed out | `ETIMEDOUT` | 封包到不了（防火牆、IP 錯誤） | 檢查網路與防火牆 |\n| Permission denied | `EACCES` | 非 root 綁定 < 1024 的 port | 換一個大於 1024 的 port |\n| Bad file descriptor | `EBADF` | 用了已關閉或未初始化的 fd | 檢查 `close` 的時機，fd 是否為 -1 |\n| Invalid argument | `EINVAL` | 例如對沒有 `listen()` 的 socket 呼叫 `accept()` | 檢查呼叫順序 |\n| Resource temporarily unavailable | `EAGAIN` | non-blocking 時沒有資料 / buffer 滿 | 這是正常的，等下次 select |\n| Too many open files | `EMFILE` | fd 用完（忘記 close，或連線太多） | 修 fd leak；`ulimit -n` |\n\n## 6. 除錯流程建議\n\n```\n程式沒反應？\n ├─ server 有在 LISTEN 嗎？                         → ss -tlnp\n │    └─ 沒有 → 看 bind/listen 的錯誤訊息；strace 看 port\n ├─ client 連得上嗎？                                → nc -zv\n ├─ 資料有送出去嗎？                                  → tcpdump\n ├─ 程式卡在哪個系統呼叫？                             → strace -p <pid>\n └─ 有沒有一直在跑但不做事（CPU 100%）？              → top；檢查 busy loop\n```\n\njudge 的 `-v` 參數會在失敗時印出 server 的輸出，記得在 server 裡多印 log（但 C 記得 `fflush(stdout)`）。\n\n## 7. 在 judge 環境之外重現問題\n\njudge 的每個測試都只是普通的 socket 操作，你可以在 Python REPL 裡手動重現：\n\n```python\nimport socket, struct, json\ns = socket.create_connection((\"127.0.0.1\", 9100))\nreq = json.dumps({\"op\": \"GET\", \"key\": \"a\"}).encode()\ns.sendall(struct.pack(\"!I\", len(req)) + req)\nn, = struct.unpack(\"!I\", s.recv(4)); print(s.recv(n))\n```\n"}, {"path": "materials/07-interview-questions.md", "title": "07. 口試常見問題與參考答案", "group": "教材", "spoiler": false, "md": "# 07. 口試常見問題與參考答案\n\n> 上機考之外，教授常會針對你寫的程式追問。下面的問題由淺入深，\n> 先自己回答，再展開參考答案。能用**自己的話**、並且**連結到你寫的程式**說明，比背答案重要。\n\n---\n\n## A. TCP 基礎\n\n<details>\n<summary><b>A1. TCP 和 UDP 的差別？各舉一個適合的應用。</b></summary>\n\nTCP 是連線導向、可靠、依序的 byte stream，有流量控制與壅塞控制；UDP 是無連線的 datagram，\n不保證送達與順序，但延遲低、標頭小、保留訊息邊界。\nTCP 適合不能掉資料的情境（網頁、檔案傳輸、SSH）；UDP 適合即時性比完整性重要的情境\n（視訊通話、線上遊戲、DNS 查詢）。另外 QUIC (HTTP/3) 是在 UDP 上自己實作可靠傳輸，\n以避免 TCP 的 head-of-line blocking 與握手延遲。\n</details>\n\n<details>\n<summary><b>A2. 為什麼 TCP 需要三次握手？兩次不行嗎？</b></summary>\n\n1. 雙方都要讓對方知道自己的初始序號 (ISN)，並確認對方收到了。SYN 要被 ACK、對方的 SYN 也要被 ACK，\n   中間的 ACK 和 SYN 可以合併，所以最少三次。\n2. 防止歷史連線：如果一個很久以前的 SYN 延遲抵達，兩次握手的 server 會直接建立連線並配置資源；\n   三次握手時 client 會發現這不是它要的連線而回 RST。\n</details>\n\n<details>\n<summary><b>A3. TIME_WAIT 是什麼？為什麼要等 2MSL？會造成什麼問題？</b></summary>\n\n主動關閉的一方在送出最後一個 ACK 後進入 TIME_WAIT，等待 2 倍的 Maximum Segment Lifetime。\n原因：(1) 最後的 ACK 可能遺失，對方會重送 FIN，要能再回 ACK；\n(2) 讓這條連線殘留在網路中的舊封包全部消失，避免干擾之後使用相同四元組的新連線。\n問題：server 重啟時 bind 會失敗 (`EADDRINUSE`)，解法是 `SO_REUSEADDR`；\n大量短連線的 client 可能耗盡 ephemeral port，解法是連線重用 (keep-alive / connection pool)。\n在我寫的 P1 中，judge 先關掉 server，所以 TIME_WAIT 出現在 server 端，不設 SO_REUSEADDR 就無法立刻重啟。\n</details>\n\n<details>\n<summary><b>A4. 什麼是「黏包」？怎麼解決？</b></summary>\n\nTCP 是 byte stream，不保留 send 的邊界，接收端一次 recv 可能拿到多則訊息、或半則訊息。\n這不是 TCP 的 bug，而是應用層要自己定義訊息邊界。常見方法：固定長度、分隔符號（如 `\\n`，我的 P3）、\n長度前綴（我的 P2：4-byte big-endian 長度 + payload）。接收端要維護 buffer，湊滿一則才處理。\n</details>\n\n<details>\n<summary><b>A5. 流量控制和壅塞控制有什麼不同？</b></summary>\n\n流量控制是避免**接收端**被淹沒：接收端在 ACK 中告知剩餘的 receive window，傳送端不能超過。\n壅塞控制是避免**網路**被淹沒：傳送端根據遺失或延遲推測網路狀況，調整 congestion window\n（slow start、AIMD、CUBIC、BBR）。實際能送的量是兩個 window 的較小值。\n</details>\n\n<details>\n<summary><b>A6. 如果網路線突然被拔掉，連線兩端會發生什麼事？</b></summary>\n\n不會有任何 FIN 或 RST，兩端都不知道。如果有一方在送資料，會不斷重傳直到逾時（Linux 預設約 15 分鐘）\n然後回報 `ETIMEDOUT`；如果雙方都沒在送資料，連線可以「半開」永遠存在。\n解法：TCP keepalive (`SO_KEEPALIVE`，預設 2 小時才開始探測)、或應用層 heartbeat + idle timeout（我的 P4）。\n</details>\n\n---\n\n## B. Socket API\n\n<details>\n<summary><b>B1. 說明 server 端從 socket() 到 close() 的流程，accept 回傳的是什麼？</b></summary>\n\n`socket` 建立 → `setsockopt(SO_REUSEADDR)` → `bind` 綁定位址 → `listen` 進入 LISTEN 狀態 →\n`accept` 取出已完成握手的連線 → `recv`/`send` → `close`。\n`accept` 回傳一個**新的** fd 代表這條連線，原本的 listening socket 不變，繼續接受其他連線。\n</details>\n\n<details>\n<summary><b>B2. listen 的 backlog 參數是什麼意思？</b></summary>\n\n已完成三次握手、但還沒被 `accept()` 取走的連線佇列上限（Linux 上，另外還有一個 SYN queue）。\n佇列滿了之後，新的 SYN 會被丟掉，client 會重試。server `accept` 太慢時就會發生。\n</details>\n\n<details>\n<summary><b>B3. 為什麼要 htons？忘記會怎樣？</b></summary>\n\n網路協定規定使用 big-endian，而 x86/ARM 通常是 little-endian。`sin_port` 必須是 network byte order。\n忘記的話 port 會被位元組對調，例如 9000 (0x2328) 會變成 10275 (0x2823)，server 監聽在錯的 port，\nclient 連線時得到 Connection refused。這正是 P1 server.c 裡的 bug，我是用 strace / ss 看到實際的 port 才發現的。\n</details>\n\n<details>\n<summary><b>B4. recv 回傳 0 代表什麼？如果沒處理會怎樣？</b></summary>\n\n代表對方已經關閉寫入方向（送了 FIN），之後不會再有資料。不處理的話，每次 recv 都會立刻回傳 0，\n程式變成無窮迴圈、CPU 100%，而且 iterative server 永遠不會去 accept 下一個 client——P1 的另一個 bug。\n</details>\n\n<details>\n<summary><b>B5. send 回傳成功代表對方收到了嗎？什麼時候 send 會只送出一部分？</b></summary>\n\n不代表。send 成功只表示資料被複製進 kernel 的 send buffer。\nsend buffer 空間不足（對方讀太慢、網路慢）、被 signal 打斷、或 non-blocking 模式下，都可能只送出一部分，\n所以要用迴圈（`send_all` / Python 的 `sendall`）。要確認對方「處理完」，必須在應用層協定設計回應（例如 P4 的 response）。\n</details>\n\n<details>\n<summary><b>B6. SIGPIPE 是什麼？server 為什麼要處理它？</b></summary>\n\n對已被對方關閉（收到 RST）的連線寫入時，kernel 會送 SIGPIPE，預設動作是終止 process。\nserver 如果不處理，任何一個 client 異常斷線都可能讓整個 server 死掉。\n解法是 `signal(SIGPIPE, SIG_IGN)` 或 send 時加 `MSG_NOSIGNAL`，讓 send 改為回傳 `EPIPE`。\n</details>\n\n<details>\n<summary><b>B7. SO_REUSEADDR 和 SO_REUSEPORT 的差別？</b></summary>\n\n`SO_REUSEADDR`：允許 bind 一個還有 TIME_WAIT 連線的位址，主要用於 server 重啟。\n`SO_REUSEPORT`（Linux 3.9+）：允許多個 socket 同時 bind 並 listen 同一個 port，kernel 會把連線分散給它們，\n用於多 process 的負載平衡（例如 nginx 的 `reuseport`）。\n</details>\n\n---\n\n## C. 併發與系統設計\n\n<details>\n<summary><b>C1. 要讓 server 同時服務多個 client，有哪些方法？</b></summary>\n\n(1) fork 每條連線一個 process；(2) 每條連線一個 thread（我的 P4）；(3) thread pool；\n(4) I/O multiplexing：select/poll/epoll + non-blocking socket，單執行緒處理所有連線（我的 P3）；\n(5) 以上的組合，例如多個 worker process，每個跑一個 epoll event loop。\nthread/process 模型好寫但連線數多時資源消耗大；event-driven 擴充性好但程式需要拆成狀態機。\n</details>\n\n<details>\n<summary><b>C2. select、poll、epoll 的差別？</b></summary>\n\nselect 用 bitmap 傳 fd 集合，有 FD_SETSIZE (1024) 上限，每次呼叫都要複製整個集合並線性掃描；\npoll 改用陣列，沒有數量上限，但仍是 O(n)；\nepoll 先用 `epoll_ctl` 註冊，kernel 內部維護 ready list，`epoll_wait` 只回傳 ready 的 fd，\n複雜度與 ready 的數量成正比，適合大量連線但只有少數活躍的情境。\nepoll 還支援 edge-triggered 模式，只在狀態改變時通知一次，需要讀到 EAGAIN 為止。\n</details>\n\n<details>\n<summary><b>C3. 你的聊天室為什麼需要 outbuf？為什麼不能直接 sendall？</b></summary>\n\nsocket 是 non-blocking 的，send buffer 滿了 sendall 會丟出 BlockingIOError，而且不知道送了多少。\n如果改成 blocking，一個不讀資料的 client 會讓 sendall 卡住，整個單執行緒 server 的所有人都卡住。\n所以要把資料放進每個 client 的 outbuf，註冊 EVENT_WRITE，等 socket 可寫時再送；送完要取消 EVENT_WRITE，\n否則因為 socket 幾乎永遠可寫，select 會一直立刻返回造成 busy loop。\n</details>\n\n<details>\n<summary><b>C4. 如果有一個 client 連上聊天室但從不讀資料，會發生什麼事？</b></summary>\n\n它的 TCP receive window 會變成 0，server 送不出去，資料會一直累積在 server 端它的 outbuf，\n記憶體無限增長，最後拖垮整個 server（slow consumer 問題）。\n解法：設定 outbuf 上限，超過就斷線或丟棄訊息；或設定寫入逾時。\n</details>\n\n<details>\n<summary><b>C5. 什麼是 race condition？你的 KV server 怎麼避免？為什麼 Python 有 GIL 還需要鎖？</b></summary>\n\n多個 thread 同時存取共享資料、且至少一個在寫入時，結果取決於執行順序。\nINCR 是讀-改-寫三步驟，兩條 thread 交錯執行會造成 lost update。\n我用一把所有 thread 共用的 `threading.Lock` 保護整個讀-改-寫。\n原本的 bug 是 `with threading.Lock():`，每次都建立新鎖，等於沒有鎖。\nGIL 只保證同一時間只有一條 thread 執行 bytecode，但 thread 可能在兩個 bytecode 之間被切換，\n而且遇到 I/O（sleep、磁碟）時 GIL 會被釋放，所以複合操作仍然需要鎖。\n</details>\n\n<details>\n<summary><b>C6. thread-per-connection 在一萬個連線時會遇到什麼問題？</b></summary>\n\n每條 thread 都有自己的 stack（Linux 預設保留 8 MB 虛擬位址空間），大量 thread 會耗盡記憶體與 thread 數量上限；\ncontext switch 的成本隨 thread 數增加；而且大部分連線其實是閒置的，thread 只是在等待。\n這就是 C10K 問題，解法是 event-driven（epoll）+ 少量 worker thread，或使用 coroutine（asyncio、Go goroutine）。\n</details>\n\n<details>\n<summary><b>C7. 你的 KV server 收到不合法的 JSON 時繼續服務，但 length 太大時直接斷線，為什麼？</b></summary>\n\nJSON 錯誤時，整則訊息已經按照 length 完整讀完，串流仍然對齊，下一個 header 位置是正確的，可以繼續。\nlength 太大時我們沒有讀 payload（也不應該讀），之後的 bytes 已經無法判斷邊界，串流錯位，只能斷線。\n另外 length 上限本身是防禦：沒有上限的話，攻擊者送 `FF FF FF FF` 就能讓 server 嘗試配置 4 GiB。\n</details>\n\n---\n\n## D. 延伸思考（沒有標準答案）\n\n1. 如果要讓 P3 的聊天室支援 10 台 server 組成的叢集，使用者連到不同台也能互相聊天，你會怎麼設計？\n2. P4 的資料都在記憶體裡，server 重啟就不見了。要怎麼做持久化？寫入順序和 crash 時的一致性要怎麼考慮？\n3. 如果要在 P2 的協定上加入加密，你會自己設計還是用 TLS？為什麼？\n4. HTTP/1.1 的 keep-alive、HTTP/2 的 multiplexing、HTTP/3 的 QUIC，各自想解決 TCP 的什麼問題？\n5. judge 是怎麼測出你的程式有沒有正確處理「半包」的？如果要你出一題 judge，你會怎麼測 P3 的 slow consumer 問題？\n"}, {"path": "solutions/README.md", "title": "參考解答與解析", "group": "考後", "spoiler": true, "md": "# 參考解答與解析\n\n> 考完再看！解答程式碼在同資料夾的 `p1_echo/` ~ `p4_kvstore/`，裡面用 `TODO x-x` 與 `[BUG 修正]` 標出修改處。\n\n---\n\n## P1：Echo Server / Client\n\n### TODO\n\n| 編號 | 解答 | 重點 |\n|------|------|------|\n| 1-A | `socket(AF_INET, SOCK_STREAM, 0)` | `AF_INET` = IPv4，`SOCK_STREAM` = TCP |\n| 1-B | `setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &opt, sizeof(opt))` | 必須在 `bind()` **之前**設定 |\n| 1-C | `bind(fd, (struct sockaddr *)&addr, sizeof(addr))` → `listen(fd, BACKLOG)` | `sockaddr_in` 要轉型成通用的 `sockaddr *` |\n| 1-D | `accept(listen_fd, (struct sockaddr *)&cli, &cli_len)` | 第三個參數是**指標**（value-result argument） |\n| 1-E | `send(fd, buf + sent, len - sent, 0)` | 從「還沒送的地方」開始送 |\n| 1-F | `socket` → 填 `sockaddr_in` (`htons`, `inet_pton`) → `connect` | |\n| 1-G | 迴圈 `recv` 直到收滿 `len` bytes，`n == 0` 代表對方關閉 | 一次 `recv` 不保證收到完整一行 |\n\n### 🐞 Bug 1：`addr.sin_port = port;`\n\nport 必須是 **network byte order (big-endian)**。x86 是 little-endian，9000 (`0x2328`)\n不轉換的話會變成 `0x2823` = 10275，server 實際上監聽在錯的 port。\n修正：`addr.sin_port = htons((uint16_t)port);`\n\n### 🐞 Bug 2：`handle_client` 沒處理 `recv()` 回傳 0\n\n`recv()` 回傳 0 代表對方送了 FIN（正常關閉）。原本的程式會呼叫 `send_all(fd, buf, 0)`\n然後再 `recv()`，又拿到 0……**無窮迴圈**，第二個 client 永遠等不到服務。\n修正：`if (n == 0) break;`\n\n### 為什麼 judge 的 client 測試會抓到 1-G 原本的寫法？\n\njudge 的測試 server 會把資料每 7 bytes 切一塊、間隔 3ms 送出。原本的寫法只 `recv()` 一次，\n收到的只是一部分，剩下的資料會在下一輪才被讀到，最後一行的尾巴則永遠不會被讀出來。\n\n---\n\n## P2：Framing\n\n### 🐞 Bug：`struct.Struct(\"I\")`\n\n`\"I\"` 是 **native byte order + native alignment**，在 x86 上是 little-endian，\n`b\"hello\"` 的 header 變成 `b\"\\x05\\x00\\x00\\x00\"`。網路協定要用 `\"!I\"`（或 `\">I\"`）。\n\n| 格式字元 | byte order | 大小/對齊 |\n|----------|-----------|-----------|\n| `@` (預設) | native | native |\n| `=` | native | standard |\n| `<` | little-endian | standard |\n| `>` / `!` | big-endian | standard |\n\n### `recv_msg` 怎麼區分「正常結束」與「中途斷線」？\n\n先單獨 `recv` 一次 header：如果一個 byte 都沒拿到 → 對方在訊息之間關閉 → `None`；\n如果拿到一部分 → 用 `recv_exact` 補齊，這時候再斷線就是 `ConnectionError`。\n\n```python\nfirst = sock.recv(HEADER.size)\nif not first:\n    return None\nheader = first + recv_exact(sock, HEADER.size - len(first))\n```\n\n### 常見錯誤\n- `recv_exact` 用 `sock.recv(65536)` 讀 → **多讀**到下一則訊息的資料，然後被丟掉\n- 空訊息回傳 `None` → 呼叫端以為連線結束了\n- 先 `recv_exact(length)` 再檢查 `MAX_MSG_SIZE` → 攻擊者送一個 `0xFFFFFFFF` 的 header 就能讓你配置 4 GiB\n- 用 `send` 而不是 `sendall`\n\n---\n\n## P3：Chat Server\n\n### 🐞 Bug：`broadcast` 忽略了 `exclude`，也沒跳過還沒設定暱稱的連線\n\n```python\nfor c in list(self.clients.values()):\n    if c is exclude or c.nick is None:\n        continue\n    self.send(c, text)\n```\n\n### TODO 重點\n\n- **3-C 切行**：`while b\"\\n\" in inbuf and not client.closed:`。`not client.closed` 很重要——\n  `/quit` 之後同一個封包裡剩下的行不能再處理（judge 有測）。\n- **3-D / 3-E 寫入事件的開關**：socket 的 send buffer 幾乎永遠有空間，所以一直監聽\n  `EVENT_WRITE` 的話 `select()` 會不斷立刻返回 → CPU 100%（busy loop）。\n  正確作法是**有資料要送才監聽，送完就取消**。\n- **為什麼不能在 `send()` 裡直接 `sendall()`？** non-blocking socket 的 send buffer 滿了，\n  `sendall` 會 raise `BlockingIOError`，而且你不知道送出去了多少。\n  如果改成 blocking，一個不讀資料的 client 就能卡住整個 server。\n- **3-F 的順序**：先把自己從 `self.clients` 移除再 `broadcast`，否則會送給已經關閉的 socket。\n\n---\n\n## P4：KV Server\n\n### 🐞 Bug：`with threading.Lock():`\n\n每次呼叫都**建立一把新的鎖**，每個 thread 都拿到自己專屬的鎖，等於沒鎖。必須用共用的 `self.lock`。\n\nread-modify-write（讀 → 算 → 寫回）不是 atomic 的：\n\n```\nThread A: cur = data[\"c\"]   # 0\nThread B: cur = data[\"c\"]   # 0\nThread A: data[\"c\"] = 1\nThread B: data[\"c\"] = 1     # A 的更新不見了 (lost update)\n```\n\n`_simulate_disk_latency()` 把讀和寫之間的時間拉長，讓 race condition 幾乎必定發生。\n就算刪掉它，bug 仍然存在，只是變得很難重現——這才是最可怕的地方。\n\n### TODO 4-B 的例外處理順序\n\n```python\ntry:\n    req = recv_json(conn)\nexcept socket.timeout:         # ① OSError 的子類別，要放最前面\n    break\nexcept ValueError:             # ② JSONDecodeError / UnicodeDecodeError，訊息已完整讀完 → 繼續服務\n    resp = error(\"bad request\")\nexcept (ConnectionError, ProtocolError, OSError):   # ③\n    break\n```\n\n為什麼 JSON 錯誤可以繼續服務，但 `ProtocolError` 要斷線？\n因為 JSON 錯誤時整則訊息已經依 length 讀完，**串流還是對齊的**；\n`ProtocolError`（length 太大）時我們沒有讀 payload，串流已經錯位，無法再繼續解析。\n\n### 進階\n- 一條連線一個 thread，連線數一多會吃光記憶體（每條 thread 預設數 MB stack）→ 可以考慮 thread pool 或 asyncio\n- 一把全域鎖會讓所有操作序列化 → 可以用 lock striping（依 key 的 hash 分成多把鎖）\n"}];

const $ = (sel) => document.querySelector(sel);
const content = $("#content");
const nav = $("#nav");
const toc = $("#toc");
const search = $("#search");

// ---------- 主題 ----------
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("tcpquiz-theme", theme);
}
applyTheme(localStorage.getItem("tcpquiz-theme")
  || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("#theme").onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

// ---------- 導覽 ----------
function buildNav(query) {
  const q = (query || "").trim().toLowerCase();
  nav.innerHTML = "";
  let group = null;
  for (const doc of DOCS) {
    let hits = 0;
    if (q) {
      const text = doc.md.toLowerCase();
      for (let i = text.indexOf(q); i !== -1; i = text.indexOf(q, i + q.length)) hits++;
      if (!hits && !doc.title.toLowerCase().includes(q)) continue;
    }
    if (doc.group !== group) {
      group = doc.group;
      const g = document.createElement("div");
      g.className = "group";
      g.textContent = group;
      nav.appendChild(g);
    }
    const a = document.createElement("a");
    a.href = "#/" + doc.path;
    a.dataset.path = doc.path;
    a.title = doc.title;
    a.textContent = (doc.spoiler ? "🔒 " : "") + doc.title;
    if (hits) {
      const s = document.createElement("span");
      s.className = "hits";
      s.textContent = `(${hits})`;
      a.appendChild(s);
    }
    nav.appendChild(a);
  }
  markActive();
}
function markActive() {
  const cur = currentPath();
  nav.querySelectorAll("a").forEach((a) => a.classList.toggle("active", a.dataset.path === cur));
}
search.addEventListener("input", () => { buildNav(search.value); render(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== search) { e.preventDefault(); search.focus(); }
  if (e.key === "Escape" && document.activeElement === search) { search.value = ""; buildNav(); render(); }
});

// ---------- 路由 ----------
function currentPath() {
  const p = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("::")[0];
  return DOCS.some((d) => d.path === p) ? p : DOCS[0].path;
}
function currentAnchor() {
  return decodeURIComponent(location.hash).split("::")[1] || "";
}

function resolvePath(base, href) {
  const parts = base.split("/").slice(0, -1);
  for (const seg of href.split("/")) {
    if (seg === "" || seg === ".") continue;
    if (seg === "..") parts.pop(); else parts.push(seg);
  }
  return parts.join("/");
}

function slugify(text, used) {
  let slug = text.trim().toLowerCase()
    .replace(/[\s]+/g, "-")
    .replace(/[^\p{L}\p{N}\-_]/gu, "") || "section";
  let s = slug, n = 1;
  while (used.has(s)) s = `${slug}-${++n}`;
  used.add(s);
  return s;
}

// ---------- 渲染 ----------
function render() {
  const path = currentPath();
  const doc = DOCS.find((d) => d.path === path);
  document.title = `${doc.title} - TCP Socket 上機考`;
  markActive();

  if (doc.spoiler && sessionStorage.getItem("tcpquiz-spoiler") !== "ok") {
    content.innerHTML = `
      <div class="spoiler">
        <h2>🔒 參考解答</h2>
        <p>這一頁有所有 TODO 的答案與 bug 解析。<br>建議完成 <a href="#/EXAM.md">試題本</a> 並跑過 judge 之後再看。</p>
        <button type="button" id="reveal">我考完了，顯示解答</button>
      </div>`;
    $("#reveal").onclick = () => { sessionStorage.setItem("tcpquiz-spoiler", "ok"); render(); };
    toc.innerHTML = "";
    return;
  }

  content.innerHTML = marked.parse(doc.md, { gfm: true });

  // 文件之間的連結 → 站內導覽；外部連結 → 新分頁
  content.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    if (/^[a-z]+:/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
    if (href.startsWith("#")) return;
    const [file] = href.split("#");
    const target = resolvePath(doc.path, file);
    if (DOCS.some((d) => d.path === target)) a.href = "#/" + target;
  });

  // 標題 id 與右側目錄
  const used = new Set();
  const heads = [...content.querySelectorAll("h2, h3")];
  heads.forEach((h) => { h.id = slugify(h.textContent, used); });
  toc.innerHTML = heads.length ? '<div class="title">本頁目錄</div>' : "";
  for (const h of heads) {
    const a = document.createElement("a");
    a.href = `#/${doc.path}::${h.id}`;
    a.className = h.tagName.toLowerCase();
    a.textContent = h.textContent;
    toc.appendChild(a);
  }

  // 程式碼上色 + 複製按鈕
  content.querySelectorAll("pre code").forEach((code) => {
    const lang = (code.className.match(/language-(\S+)/) || [])[1];
    if (lang && hljs.getLanguage(lang)) hljs.highlightElement(code);
    if (!lang) code.parentElement.classList.add("diagram");
    const btn = document.createElement("button");
    btn.className = "copy";
    btn.type = "button";
    btn.textContent = "複製";
    btn.onclick = () => navigator.clipboard.writeText(code.innerText).then(() => {
      btn.textContent = "已複製";
      setTimeout(() => (btn.textContent = "複製"), 1200);
    });
    code.parentElement.appendChild(btn);
  });

  // 搜尋關鍵字標記
  const q = search.value.trim();
  if (q) highlightText(content, q);

  // 上一篇 / 下一篇
  const i = DOCS.indexOf(doc);
  const prev = DOCS[i - 1], next = DOCS[i + 1];
  const pager = document.createElement("div");
  pager.className = "pager";
  pager.innerHTML =
    (prev ? `<a class="prev" href="#/${prev.path}"><span class="label">← 上一篇</span>${prev.title}</a>` : "<span></span>") +
    (next ? `<a class="next" href="#/${next.path}"><span class="label">下一篇 →</span>${next.title}</a>` : "<span></span>");
  content.appendChild(pager);

  const anchor = currentAnchor();
  const el = anchor && document.getElementById(anchor);
  if (el) el.scrollIntoView(); else if (!q) window.scrollTo(0, 0);
  else (content.querySelector("mark") || content).scrollIntoView({ block: "center" });
  updateTocActive();
}

function highlightText(root, q) {
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const frag = document.createDocumentFragment();
    let last = 0;
    node.nodeValue.replace(re, (m, idx) => {
      frag.append(node.nodeValue.slice(last, idx));
      const mark = document.createElement("mark");
      mark.textContent = m;
      frag.append(mark);
      last = idx + m.length;
    });
    frag.append(node.nodeValue.slice(last));
    node.replaceWith(frag);
  }
}

function updateTocActive() {
  const links = [...toc.querySelectorAll("a")];
  let current = null;
  for (const a of links) {
    const id = a.getAttribute("href").split("::")[1];
    const h = document.getElementById(id);
    if (h && h.getBoundingClientRect().top < 120) current = a;
  }
  links.forEach((a) => a.classList.toggle("active", a === current));
}

window.addEventListener("scroll", updateTocActive, { passive: true });
window.addEventListener("hashchange", render);
buildNav();
render();
</script>
</body>
</html>
